<title>QueuedToGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600&family=Playfair+Display:wght@700&display=swap">
<style>
/* Layout: workshop app shell. Sticky top bar with section tabs; each section is one working surface.
   Event forms carry their own theme (colours, fonts, corners, artwork) set in the builder. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#E8EAF1; --fg:#161A2B; --muted:#5A6077; --line:#D4D8E3;
  --accent:#3346D3; --accent-fg:#FFFFFF; --accent-soft:#E2E6FF;
  --good:#1D8657; --good-soft:#DDF3E8; --warn:#9A6512; --warn-soft:#FBEFD6; --bad:#BF3438; --bad-soft:#FBE1E1;
  --s-new:#7B8194; --s-artwork:#9A5BD0; --s-production:#3346D3; --s-qc:#C9821B; --s-ready:#1D8657; --s-done:#5A6077;
  --shadow:0 1px 2px rgba(22,26,43,.06),0 2px 8px rgba(22,26,43,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131B; --surface:#1A1D28; --surface-2:#252937; --fg:#E7E9F2; --muted:#9BA1B8; --line:#313649;
  --accent:#8D9BFF; --accent-fg:#0F1230; --accent-soft:#262C56;
  --good:#52C68F; --good-soft:#173527; --warn:#E3B04D; --warn-soft:#3A2E14; --bad:#F27377; --bad-soft:#3E1C1F;
  --s-new:#9BA1B8; --s-artwork:#C493F0; --s-production:#8D9BFF; --s-qc:#E3B04D; --s-ready:#52C68F; --s-done:#7D839A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131B; --surface:#1A1D28; --surface-2:#252937; --fg:#E7E9F2; --muted:#9BA1B8; --line:#313649;
  --accent:#8D9BFF; --accent-fg:#0F1230; --accent-soft:#262C56;
  --good:#52C68F; --good-soft:#173527; --warn:#E3B04D; --warn-soft:#3A2E14; --bad:#F27377; --bad-soft:#3E1C1F;
  --s-new:#9BA1B8; --s-artwork:#C493F0; --s-production:#8D9BFF; --s-qc:#E3B04D; --s-ready:#52C68F; --s-done:#7D839A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:21px}
.brand h1 span{color:var(--accent)}
.ws{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.note{font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px;border-top:1px dashed var(--line)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}

main{padding-block:20px 48px}
.view-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:26px}
.view-head p{margin:2px 0 0;color:var(--muted);max-width:66ch}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.alert b{color:var(--bad)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.stagepill{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.evtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.evtag i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.evtag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=url],input[type=search],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
label.f small,.hint{font-weight:400;color:var(--muted);font-size:12.5px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.row{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(14px)}

/* ---------- Forms list ---------- */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.evcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.evthumb{aspect-ratio:12/5;background:var(--c);position:relative;overflow:hidden;max-width:100%}
.evthumb img{width:100%;height:100%;object-fit:cover;display:block}
.evthumb .pill{position:absolute;top:10px;left:10px}
.evthumb .noart{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;opacity:.8}
.evbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.evbody h3{font-size:18px}
.evnums{font-size:13px;color:var(--muted);margin-top:4px}
.evacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.newcard{border:1.5px dashed var(--line);border-radius:12px;background:none;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;min-height:220px;color:var(--muted)}
.newcard:hover{border-color:var(--accent);color:var(--accent)}
.newcard b{display:block;font:600 18px var(--f-display);color:var(--fg);margin-bottom:4px}

/* ---------- Builder ---------- */
.b-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.b-top h2{font-size:22px;min-width:0;overflow-wrap:anywhere}
.b-top .sp{flex:1}
.builder{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.builder{grid-template-columns:minmax(0,1fr)}}
.bpanel{padding:0;overflow:hidden}
.btabs{display:flex;border-bottom:1px solid var(--line)}
.btabs button{flex:1;border:0;background:none;padding:12px 8px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.btabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.bbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.bsec{display:flex;flex-direction:column;gap:10px}
.bsec h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.blks{display:flex;flex-direction:column;gap:6px}
.blk{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.blk.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.blk-row{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 0}
.blk-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column}
.blk-type{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.blk-label{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk-label .req{color:var(--bad)}
.blk-acts{display:flex}
.blk-acts button{border:0;background:none;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px}
.blk-acts button:hover{background:var(--surface-2);color:var(--fg)}
.blk-acts button:disabled{opacity:.3;cursor:default;background:none}
.blk-ed{border-top:1px dashed var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.addgrid button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font-size:13px;display:flex;gap:8px;align-items:center}
.addgrid button:hover{border-color:var(--accent);color:var(--accent)}
.addgrid b{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px;text-align:center}
.artbox{display:flex;gap:12px;align-items:center}
.artbox .th{width:120px;aspect-ratio:12/5;border-radius:8px;overflow:hidden;background:var(--surface-2);flex:none;display:grid;place-items:center;font-size:12px;color:var(--muted);max-width:100%}
.artbox .th img{width:100%;height:100%;object-fit:cover;display:block}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches span{width:28px;height:28px;border-radius:6px;background:var(--c);border:1px solid var(--line)}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.colors input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.colors code{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto}
.contrast{font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.contrast .ok{color:var(--good)} .contrast .low{color:var(--bad)}
.fontpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.fontpick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.fontpick button b{font-size:20px;line-height:1.2}
.fontpick button span{font-size:12px;color:var(--muted)}
.fontpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;max-width:100%}
.linkbox span{overflow-wrap:anywhere;font-size:13px;flex:1;min-width:0}

.bprev{position:sticky;top:130px;min-width:0}
@media (max-width:920px){.bprev{position:static}}
.bprev-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bprev-bar .seg{margin-left:auto}
.bprev-frame{border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 190px);background:var(--surface-2);margin-inline:auto;transition:max-width .2s}
@media (max-width:920px){.bprev-frame{max-height:none}}
.bprev-frame.phone{max-width:390px}

/* ---------- Event form (themed by the event, not the app) ---------- */
.qf-wrap{container-type:inline-size;background:var(--p);color:var(--t);font-family:var(--bf);line-height:1.5}
.qf{position:relative;min-height:100%}
.qf-art img{display:block;width:100%;aspect-ratio:12/5;object-fit:cover;max-width:100%}
.qf-bg{position:absolute;inset:0;overflow:hidden}
.qf-bg img{width:100%;height:100%;object-fit:cover;display:block}
.qf-bg::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--p) 35%,transparent)}
.qf-main{position:relative;padding:0 16px 40px}
.qf-banner .qf-main{margin-top:-48px}
.qf-banner.noart .qf-main,.qf-side.noart .qf-main{margin-top:0;padding-top:32px}
.qf-background .qf-main{padding-top:56px;padding-bottom:56px}
.qf-card{background:var(--c);color:var(--t);max-width:620px;margin-inline:auto;border-radius:min(var(--r),20px);padding:28px clamp(18px,5cqi,36px);display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
@container (min-width:760px){
  .qf-side .qf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .qf-side .qf-art{position:sticky;top:0;align-self:start;height:100%}
  .qf-side .qf-art img{height:100%;min-height:520px;aspect-ratio:auto}
  .qf-side .qf-main{margin-top:0;padding:40px 32px}
  .qf-side .qf-card{box-shadow:none}
}
.qf-eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--a) 45%,var(--t))}
.qf-title{font-family:var(--hf);font-size:clamp(28px,6cqi,42px);line-height:1.08;margin:0;text-transform:var(--tt);text-wrap:balance;letter-spacing:-.01em}
.qf-intro{margin:0;opacity:.85}
.qf-form{display:flex;flex-direction:column;gap:20px}
.qf-field{display:flex;flex-direction:column;gap:7px;border-radius:8px;scroll-margin-top:140px}
.qf-label{font-weight:600;font-size:15px}
.qf-req{color:color-mix(in srgb,var(--a) 45%,var(--t));margin-left:3px}
.qf-help{font-size:13px;opacity:.72;margin-top:-4px}
.qf-in{background:color-mix(in srgb,var(--t) 5%,var(--c));border:1.5px solid color-mix(in srgb,var(--t) 20%,transparent);color:var(--t);border-radius:min(var(--r),12px);padding:11px 13px;width:100%;min-width:0;font:inherit}
.qf-in:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent)}
textarea.qf-in{min-height:90px;resize:vertical}
.qf-in::placeholder{color:color-mix(in srgb,var(--t) 45%,transparent)}
.qf-opts{display:flex;flex-wrap:wrap;gap:8px}
.qf-opt{position:relative;cursor:pointer}
.qf-opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.qf-opt span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1.5px solid color-mix(in srgb,var(--t) 24%,transparent);border-radius:var(--r);font-weight:500;transition:background .12s,border-color .12s}
.qf-opt:hover span{border-color:var(--a)}
.qf-opt input:checked+span{background:var(--a);color:var(--at);border-color:var(--a)}
.qf-opt input:focus-visible+span{outline:2px solid var(--a);outline-offset:2px}
.qf-sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.qf-sizes label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;text-align:center;opacity:.9}
.qf-sizes input{text-align:center}
.qf-upload{display:flex;align-items:center;gap:12px;border:1.5px dashed color-mix(in srgb,var(--t) 30%,transparent);border-radius:min(var(--r),12px);padding:14px;cursor:pointer;font-size:14px}
.qf-upload:hover{border-color:var(--a)}
.qf-upload img{width:48px;height:48px;object-fit:contain;border-radius:6px;background:color-mix(in srgb,var(--t) 6%,var(--c))}
.qf-upload b{color:var(--a)}
.qf-link{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:11px 18px;border:2px solid var(--a);color:var(--t);border-radius:var(--r);font-weight:600;text-decoration:none}
.qf-link:hover{background:color-mix(in srgb,var(--a) 14%,transparent)}
.qf-h{font-family:var(--hf);font-size:21px;margin:6px 0 -6px;text-transform:var(--tt)}
.qf-p{margin:0;opacity:.85}
.qf-hr{border:0;border-top:1.5px solid color-mix(in srgb,var(--t) 15%,transparent);margin:0;width:100%}
.qf-check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.qf-check input{margin-top:4px;accent-color:var(--a)}
.qf-err{color:var(--t);font-weight:600;font-size:14px;background:color-mix(in srgb,#E5484D 22%,var(--c));border-radius:8px;padding:10px 12px}
.qf-err:empty{display:none}
.qf-field.invalid .qf-in,.qf-field.invalid .qf-opt span,.qf-field.invalid .qf-upload{border-color:#E5484D}
.qf-submit{background:var(--a);color:var(--at);border:0;border-radius:var(--r);padding:15px 24px;font-weight:700;font-size:16px;cursor:pointer;font-family:var(--hf);text-transform:var(--tt);letter-spacing:.01em}
.qf-submit:hover{filter:brightness(1.06)}
.qf-closed{padding:16px;border-radius:10px;background:color-mix(in srgb,var(--t) 7%,var(--c));font-weight:500}
.qf-done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.qf-done .num{font-family:var(--f-mono);font-size:28px;font-weight:500;color:var(--a)}
.qf-done .lk{font-family:var(--f-mono);font-size:13px;background:color-mix(in srgb,var(--t) 6%,var(--c));padding:8px 12px;border-radius:8px;overflow-wrap:anywhere}
.qf-powered{text-align:center;font-size:12px;opacity:.6;margin-top:14px;position:relative}
.editing .qf-field{cursor:pointer;outline:2px dashed transparent;outline-offset:6px;transition:outline-color .12s}
.editing .qf-field:hover{outline-color:color-mix(in srgb,var(--a) 50%,transparent)}
.editing .qf-field.sel{outline-color:var(--a)}
.editing .qf-field *,.editing .qf-submit{pointer-events:none}
/* tracking steps inside a themed card */
.tsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tsteps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;position:relative;padding-bottom:16px}
.tsteps li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;border-left:2px dashed color-mix(in srgb,var(--t) 25%,transparent)}

<script>
/* ================= Constants ================= */
const STAGES=[
  {id:'new',name:'New order'},{id:'artwork',name:'Artwork approval'},{id:'production',name:'In production'},
  {id:'qc',name:'Quality check'},{id:'ready',name:'Ready for collection'},{id:'done',name:'Completed'}];
const TEAM=['Grace','Daniel','Ruth','Sam'];
const BUSINESS='Threadtogo';
const CHANNELS={sms:'SMS',whatsapp:'WhatsApp',email:'Email'};
const PLEX="'IBM Plex Sans',system-ui,sans-serif";
const FONTS={
  clean:{label:'Clean',head:PLEX,body:PLEX},
  bold:{label:'Bold',head:"'Bricolage Grotesque',system-ui,sans-serif",body:PLEX},
  elegant:{label:'Elegant',head:"'Playfair Display',Georgia,serif",body:PLEX},
  sporty:{label:'Sporty',head:"'Oswald','Arial Narrow',sans-serif",body:PLEX,upper:true},
  friendly:{label:'Friendly',head:"'Baloo 2',system-ui,sans-serif",body:"'Baloo 2',system-ui,sans-serif"}};
const RADII={square:'3px',rounded:'12px',pill:'999px'};
const LAYOUTS={banner:'Banner on top',background:'Full background',side:'Side by side'};
const BLOCKS={
  short:{name:'Short answer',k:'Aa'}, long:{name:'Long answer',k:'¶'},
  email:{name:'Email',k:'@'}, phone:{name:'Phone',k:'#'},
  choice:{name:'Choice buttons',k:'◉',opts:true}, multi:{name:'Multi-select buttons',k:'☑',opts:true},
  dropdown:{name:'Dropdown',k:'▾',opts:true}, sizes:{name:'Quantity per size',k:'12',opts:true},
  date:{name:'Date',k:'D'}, upload:{name:'File upload',k:'↑'},
  button:{name:'Link button',k:'↗',deco:true}, heading:{name:'Heading',k:'H',deco:true},
  text:{name:'Text',k:'T',deco:true}, divider:{name:'Divider',k:'—',deco:true}};
const isInput=f=>!BLOCKS[f.type].deco;

/* ================= Helpers ================= */
const DAY=864e5, now=()=>Date.now();
const isoDay=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>isoDay(now());
const fmtDay=iso=>iso?new Date(iso+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}):'';
const fmtTime=t=>new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const stageName=id=>STAGES.find(s=>s.id===id).name;
const stageIdx=id=>STAGES.findIndex(s=>s.id===id);
const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'form';
const $=id=>document.getElementById(id);

/* colour maths */
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const rgb2hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t))};
const lum=h=>{const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const sat=h=>{const[r,g,b]=hex2rgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx===mn)return 0;const l=(mx+mn)/2;return (mx-mn)/(1-Math.abs(2*l-1))};
const bestOn=bg=>contrast(bg,'#FFFFFF')>=contrast(bg,'#141414')?'#FFFFFF':'#141414';

function paletteFromCanvas(ctx,w,h){
  const d=ctx.getImageData(0,0,w,h).data, buckets={};
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;
    const k=[d[i],d[i+1],d[i+2]].map(v=>v>>4).join(',');
    (buckets[k]=buckets[k]||{n:0,r:0,g:0,b:0}).n++;buckets[k].r+=d[i];buckets[k].g+=d[i+1];buckets[k].b+=d[i+2];}
  const list=Object.values(buckets).sort((a,b)=>b.n-a.n).map(b=>rgb2hex([b.r/b.n,b.g/b.n,b.b/b.n]));
  const out=[];
  for(const c of list){if(out.every(o=>{const A=hex2rgb(o),B=hex2rgb(c);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])>60}))out.push(c);if(out.length>=6)break}
  return out;
}
function themeFromPalette(p,base){
  const page=p[0];
  const darkPage=lum(page)<.05;
  const card=darkPage?mix(page,'#FFFFFF',.08):mix(page,'#FFFFFF',.92);
  const text=darkPage?mix(page,'#FFFFFF',.93):mix(page,'#000000',.82);
  let accent=[...p].sort((a,b)=>(sat(b)-(Math.abs(lum(b)-.35)))-(sat(a)-(Math.abs(lum(a)-.35))))[0]||page;
  for(let i=0;i<12&&contrast(accent,card)<1.8;i++)accent=mix(accent,darkPage?'#FFFFFF':'#000000',.12);
  return {...base,page,card,text,accent,accentText:bestOn(accent)};
}

/* ---------- generated sample artwork ---------- */
const artCache={};
function genArt(kind){
  if(artCache[kind])return artCache[kind];
  const c=document.createElement('canvas');c.width=1200;c.height=500;const g=c.getContext('2d');
  const W=1200,H=500;
  if(kind==='food'){
    const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#0F4C4A');gr.addColorStop(1,'#14615C');g.fillStyle=gr;g.fillRect(0,0,W,H);
    [[980,120,210,'#F2994A'],[1120,380,150,'#F7C948'],[180,420,180,'#E8633A'],[640,-40,120,'#F7C948']].forEach(([x,y,r,col])=>{g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()});
    g.strokeStyle='#FFF4E2';g.lineWidth=10;g.globalAlpha=.85;
    for(let k=0;k<4;k++){g.beginPath();for(let x=0;x<=W;x+=10){const y=150+k*70+Math.sin(x/70+k)*18;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
    g.globalAlpha=1;g.fillStyle='#FFF4E2';for(let i=0;i<60;i++){g.beginPath();g.arc((i*197)%W,(i*131)%H,4,0,7);g.fill()}
  }else if(kind==='sports'){
    g.fillStyle='#12306B';g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=6;
    for(let k=0;k<6;k++){g.beginPath();g.ellipse(W*.35,H*1.15,300+k*70,190+k*55,0,Math.PI,2*Math.PI);g.stroke()}
    g.fillStyle='#FFC93C';g.beginPath();g.moveTo(760,0);g.lineTo(920,0);g.lineTo(700,H);g.lineTo(540,H);g.fill();
    g.fillStyle='#E4572E';g.beginPath();g.moveTo(960,0);g.lineTo(1010,0);g.lineTo(790,H);g.lineTo(740,H);g.fill();
    g.fillStyle='#FFFFFF';for(let i=0;i<5;i++){const x=980+i*45,y=80+i*70;g.save();g.translate(x,y);g.rotate(.3);g.fillRect(-14,-14,28,28);g.restore()}
  }else{
    g.fillStyle='#170B2E';g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(155,92,255,.35)';g.lineWidth=2;
    for(let i=0;i<=20;i++){g.beginPath();g.moveTo(W/2,H*.55);g.lineTo(i*W/20,H);g.stroke()}
    for(let i=0;i<6;i++){g.beginPath();g.moveTo(0,H*.55+i*i*7);g.lineTo(W,H*.55+i*i*7);g.stroke()}
    g.shadowBlur=30;g.lineWidth=12;
    [['#FF4FA3',240],['#3DE3F5',190],['#FFB13D',140]].forEach(([col,r])=>{g.shadowColor=col;g.strokeStyle=col;g.beginPath();g.arc(W/2,H*.55,r,Math.PI,2*Math.PI);g.stroke()});
    g.shadowBlur=0;
  }
  return artCache[kind]=c.toDataURL('image/jpeg',.88);
}
const artSrc=ev=>ev.art?(ev.art.data||(ev.art.gen?genArt(ev.art.gen):null)):null;
function ensurePalette(ev,cb){
  if(ev.palette&&ev.palette.length)return cb&&cb();
  const src=artSrc(ev);if(!src)return;
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=80;c.height=Math.round(80*img.height/img.width)||40;
    const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);ev.palette=paletteFromCanvas(g,c.width,c.height);save();cb&&cb()};img.src=src;
}

const getEv=id=>S.events.find(e=>e.id===id);
const findJob=num=>S.jobs.find(j=>j.num===+num);
const findSub=id=>S.subs.find(s=>s.id===id);
const trackLink=j=>'queuedtogo.app/t/'+j.token;
const formLink=ev=>'queuedtogo.app/f/'+ev.slug;

function sumQty(v){return v&&typeof v==='object'&&!Array.isArray(v)?Object.values(v).reduce((a,b)=>a+(+b||0),0):0}
function ansText(f,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
  if(f.type==='sizes')return Object.entries(v).filter(([,n])=>+n>0).map(([s,n])=>`${s} ${n}`).join(', ');
  if(Array.isArray(v))return v.join(', ');
  if(f.type==='upload')return v.name||'';
  if(f.type==='date')return fmtDay(v);
  return String(v);
}
function createSubmission(S,ev,answers,consent,o={}){
  const t=o.t||now();
  const fv=type=>{const f=ev.fields.find(f=>f.type===type);return f?answers[f.id]:''};
  const nameF=ev.fields.find(f=>f.role==='name')||ev.fields.find(f=>f.type==='short');
  const itemF=ev.fields.find(f=>f.role==='item');
  const sizesF=ev.fields.find(f=>f.type==='sizes');
  const dueF=ev.fields.find(f=>f.role==='due');
  const name=(nameF&&answers[nameF.id])||'Customer';
  const qty=sizesF?sumQty(answers[sizesF.id]):0;
  const item=itemF?ansText(itemF,answers[itemF.id]):'';
  const sub={id:uid(),eventId:ev.id,t,answers,consent:!!consent,num:null,example:!!o.example};
  S.subs.push(sub);
  if(ev.autoJob){
    const j={num:S.nextNum++,token:uid(),eventId:ev.id,subId:sub.id,example:!!o.example,
      customer:{name,phone:fv('phone')||'',email:fv('email')||'',channel:ev.notify.channel,consent:!!consent},
      summary:(qty?qty+' × ':'')+(item||'Order'),due:(dueF&&answers[dueF.id])||ev.date,stage:'new',assignee:'',created:t,
      events:[{t,who:name,text:'Submitted the '+ev.title+' form',type:'stage',stage:'new'}]};
    S.jobs.push(j);sub.num=j.num;
    if(o.silent){if(S.rules.new.on&&consent)S.messages.push(makeMsg(S,j,'new',t,o.example))}
    else sub.notice=notify(j,'new');
  }
  return sub;
}
function makeMsg(S,j,stage,t,example){
  const c=j.customer, ev=getEvIn(S,j.eventId);
  const body=S.rules[stage].text.replaceAll('{name}',c.name.split(' ')[0]).replaceAll('{order}','QTG-'+j.num)
    .replaceAll('{business}',BUSINESS).replaceAll('{link}',trackLink(j)).replaceAll('{event}',ev?ev.title:'');
  return {id:uid(),num:j.num,to:c.channel==='email'?c.email:c.phone,contact:c.name,channel:c.channel,body,t,stage,example:!!example};
}
const getEvIn=(S,id)=>S.events.find(e=>e.id===id);
function notify(j,stage){
  const r=S.rules[stage],c=j.customer;
  if(!r.on)return 'No customer message for this stage.';
  if(!c.consent)return `${c.name} did not agree to updates, so no message was sent.`;
  if(c.channel==='email'?!c.email:!c.phone)return `No ${c.channel==='email'?'email address':'phone number'} on this order, so no message was sent.`;
  S.messages.push(makeMsg(S,j,stage,now()));
  return `${CHANNELS[c.channel]} update sent to ${c.name}.`;
}
function moveJob(num,stage){
  const j=findJob(num);if(!j||j.stage===stage)return;
  const from=j.stage;j.stage=stage;
  j.events.push({t:now(),who:'You',text:`Moved from ${stageName(from)} to ${stageName(stage)}`,type:'stage',stage});
  const sent=notify(j,stage);save();render();
  toast(`QTG-${j.num} moved to ${stageName(stage)}. ${sent}`);
}

function toast(msg,action){
  const el=$('toast');el.innerHTML='';const s=document.createElement('span');s.textContent=msg;el.append(s);
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();el.hidden=true};el.append(b)}
  el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,action?6000:3800);
}

}

function themeStyle(t){const f=FONTS[t.font]||FONTS.clean;return `--p:${t.page};--c:${t.card};--t:${t.text};--a:${t.accent};--at:${t.accentText};--r:${RADII[t.radius]};--hf:${f.head};--bf:${f.body};--tt:${f.upper?'uppercase':'none'}`}
function fieldHtml(f,mode){
  const sel=mode==='edit'&&U.sel===f.id?' sel':'';
  const req=f.required?'<span class="qf-req" aria-hidden="true">*</span>':'';
  const help=f.help?`<div class="qf-help">${esc(f.help)}</div>`:'';
  const ph=f.placeholder?` placeholder="${esc(f.placeholder)}"`:'';
  const lab=`<label class="qf-label" for="q-${f.id}">${esc(f.label)}${req}</label>`;
  const glab=`<span class="qf-label" id="ql-${f.id}">${esc(f.label)}${req}</span>`;
  let inner='';
  switch(f.type){
    case 'heading':inner=`<h3 class="qf-h">${esc(f.label)}</h3>`;break;
    case 'text':inner=`<p class="qf-p">${esc(f.label)}</p>`;break;
    case 'divider':inner='<hr class="qf-hr">';break;
    case 'button':inner=`<a class="qf-link" href="${esc(f.url||'#')}" target="_blank" rel="noopener">${esc(f.label)} <span aria-hidden="true">↗</span></a>`;break;
    case 'short':case 'email':case 'phone':case 'date':
      inner=lab+help+`<input class="qf-in" id="q-${f.id}" name="${f.id}" type="${{short:'text',email:'email',phone:'tel',date:'date'}[f.type]}"${ph}${f.type==='phone'?' inputmode="tel" autocomplete="tel"':''}${f.type==='email'?' autocomplete="email"':''}>`;break;
    case 'long':inner=lab+help+`<textarea class="qf-in" id="q-${f.id}" name="${f.id}"${ph}></textarea>`;break;
    case 'dropdown':inner=lab+help+`<select class="qf-in" id="q-${f.id}" name="${f.id}"><option value="">Choose…</option>${f.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;break;
    case 'choice':case 'multi':
      inner=glab+help+`<div class="qf-opts" role="${f.type==='choice'?'radiogroup':'group'}" aria-labelledby="ql-${f.id}">${f.options.map(o=>`<label class="qf-opt"><input type="${f.type==='choice'?'radio':'checkbox'}" name="${f.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;break;
    case 'sizes':inner=glab+help+`<div class="qf-sizes">${f.options.map(o=>`<label>${esc(o)}<input class="qf-in" type="number" min="0" inputmode="numeric" name="${f.id}" data-size="${esc(o)}" placeholder="0"></label>`).join('')}</div>`;break;
    case 'upload':inner=glab+help+`<label class="qf-upload" for="q-${f.id}" id="qp-${f.id}"><span><b>Choose a file</b> or drop it here</span></label><input type="file" id="q-${f.id}" data-up="${f.id}" accept="image/*,.pdf" hidden>`;break;
  }
  return `<div class="qf-field${sel}" data-fid="${f.id}">${inner}</div>`;
}
function formHtml(ev,mode,doneSub){

function editorHtml(f){

    }

    ensurePalette(ev,()=>{const sw=$('sw');if(sw&&U.btab==='design')sw.innerHTML=ev.palette.map(c=>`<span style="--c:${c}" title="${c}"></span>`).join('')});
    $('art-in').onchange=e=>{const file=e.target.files[0];if(!file)return;
      const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
        const w=Math.min(1600,img.width),h=Math.round(w*img.height/img.width),c=document.createElement('canvas');c.width=w;c.height=h;
        const g=c.getContext('2d');g.drawImage(img,0,0,w,h);

        const s=document.createElement('canvas');s.width=80;s.height=Math.max(1,Math.round(80*h/w));const sg=s.getContext('2d');sg.drawImage(img,0,0,s.width,s.height);

        toast('Artwork added and the form colours now match it. Fine-tune them below.',{label:'Keep my old colours',fn:()=>{ev.theme={...ev.theme,...old};save();render()}});
      };img.onerror=()=>toast('That file could not be read as an image. Try a PNG or JPG.');img.src=r.result};
      const old={page:t.page,card:t.card,text:t.text,accent:t.accent,accentText:t.accentText};r.readAsDataURL(file)};
    const rm=$('art-rm');if(rm)rm.onclick=()=>{const old=ev.art;ev.art=null;ev.palette=null;save();render();toast('Artwork removed.',{label:'Undo',fn:()=>{ev.art=old;save();render()}})};

    document.querySelectorAll('[data-col]').forEach(inp=>inp.oninput=()=>{t[inp.dataset.col]=inp.value.toUpperCase();inp.parentElement.querySelector('code').textContent=t[inp.dataset.col];
      const c1=contrast(t.text,t.card),c2=contrast(t.accentText,t.accent);
      $('contrast').innerHTML=[[c1,'Text on form'],[c2,'Button text']].map(([r,l])=>`<span class="${r>=4.5?'ok':'low'}">${r>=4.5?'✓':'!'} ${l} ${r.toFixed(1)}:1${r>=4.5?'':' — hard to read, pick a stronger colour'}</span>`).join('');
      commit(false)});
    document.querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>{t.layout=b.dataset.lay;commit(true)});

  }
  if(U.btab==='settings'){

    document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{ev.status=b.dataset.status;commit(true);toast(ev.status==='live'?'Form is live. Customers can now submit orders.':ev.status==='closed'?'Form closed. New orders are turned off.':'Form set to draft.')});

    $('st-job').onchange=e=>{ev.autoJob=e.target.checked;commit(false)};
    $('st-chan').onchange=e=>{ev.notify.channel=e.target.value;commit(false)};
    $('st-consent').onchange=e=>{ev.notify.consent=e.target.checked;commit(false)};
  }

/* ---------- Live form (customer view) ---------- */
function fillView(){
  const ev=getEv(U.fillId),sub=U.fillDone?findSub(U.fillDone):null;
  return `<div class="fill-bar"><button class="btn small ghost" id="fb-back">← Back</button>
    <span>Customer view of <b>${esc(ev.title)}</b> at <span class="mono">${formLink(ev)}</span>. Orders you submit here are added to the prototype.</span>
    <span style="flex:1"></span><button class="btn small" id="fb-edit">Edit form</button>${sub?'<button class="btn small primary" id="fb-see">See this submission</button>':''}</div>
    <div class="fill-frame">${formHtml(ev,'live',sub)}</div>`;
}
function bindFill(){
  const ev=getEv(U.fillId);
  $('fb-back').onclick=()=>go('events');
  $('fb-edit').onclick=()=>go('builder',{builderId:ev.id});
  if($('fb-see'))$('fb-see').onclick=()=>{const s=findSub(U.fillDone);go('subs',{subsEv:ev.id});U.openSub=s.id;renderDrawer()};
  if($('qf-again'))$('qf-again').onclick=()=>{U.fillDone=null;render()};
  const form=$('qf-form');if(!form)return;
  const uploads={};
  form.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=()=>{const file=inp.files[0];if(!file)return;const id=inp.dataset.up,box=$('qp-'+id);
    if(!file.type.startsWith('image/')||file.size>4e6){uploads[id]={name:file.name};box.innerHTML=`<span><b>${esc(file.name)}</b><br><small>Tap to replace</small></span>`;return}
    const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const w=Math.min(800,img.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(w*img.height/img.width);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);uploads[id]={name:file.name,data:c.toDataURL('image/png')};
      box.innerHTML=`<img src="${uploads[id].data}" alt=""><span><b>${esc(file.name)}</b><br><small>Tap to replace</small></span>`};img.src=r.result};r.readAsDataURL(file)});
  form.onsubmit=e=>{
    e.preventDefault();
    const answers={};let bad=null;
    form.querySelectorAll('.qf-field').forEach(el=>el.classList.remove('invalid'));
    for(const f of ev.fields){
      if(!isInput(f))continue;let v;
      if(f.type==='choice'){const c=form.querySelector(`input[name="${f.id}"]:checked`);v=c?c.value:''}
      else if(f.type==='multi')v=[...form.querySelectorAll(`input[name="${f.id}"]:checked`)].map(c=>c.value);
      else if(f.type==='sizes'){v={};form.querySelectorAll(`input[name="${f.id}"]`).forEach(i=>{if(+i.value>0)v[i.dataset.size]=+i.value})}
      else if(f.type==='upload')v=uploads[f.id]||null;
      else v=(form.querySelector(`[name="${f.id}"]`)||{}).value?.trim()||'';
      answers[f.id]=v;
      const empty=v==null||v===''||(Array.isArray(v)&&!v.length)||(f.type==='sizes'&&!sumQty(v));
      if(!bad&&f.required&&empty)bad=[f,`Please answer "${f.label}".`];
      if(!bad&&f.type==='email'&&v&&!/^\S+@\S+\.\S+$/.test(v))bad=[f,'Check the email address. It should look like name@example.com.'];
    }
    if(bad){const el=form.querySelector(`[data-fid="${bad[0].id}"]`);el.classList.add('invalid');$('qf-err').textContent=bad[1];el.scrollIntoView({block:'center',behavior:'smooth'});return}
    const consent=ev.notify.consent?$('qf-consent').checked:true;
    const sub=createSubmission(S,ev,answers,consent);
    save();U.fillDone=sub.id;render();window.scrollTo(0,0);
    toast(sub.num?`Submission saved as job QTG-${sub.num}. ${sub.notice||''}`:'Submission saved.');
  };
}

  <div class="chips"><span class="chip"><b>${total}</b> submissions</span><span class="chip"><b>${todayN}</b> today</span><span class="chip"><b>${waiting}</b> waiting to start</span></div>
  <div class="tablewrap">${list.length?`<table class="subs"><thead><tr><th>Order</th><th>Submitted</th>${evF?cols.map(f=>`<th>${esc(f.label)}</th>`).join(''):'<th>Name</th><th>Event</th><th>Order</th>'}<th>Stage</th></tr></thead>
    <tbody>${list.map(s=>{const ev=getEv(s.eventId),j=s.num&&findJob(s.num);
      return `<tr data-sub="${s.id}" tabindex="0"><td class="mono">${s.num?'QTG-'+s.num:'—'}</td><td class="when">${fmtTime(s.t)}</td>
      ${evF?cols.map(f=>`<td>${cell(f,s.answers[f.id])}</td>`).join(''):`<td>${esc(nameOf(s))}</td><td><span class="evtag" style="--c:${ev.theme.accent}"><i></i><span>${esc(ev.title)}</span></span></td><td>${j?esc(j.summary):''}</td>`}

}

/* ---------- Production board ---------- */
const isLate=j=>j.due<today()&&stageIdx(j.stage)<stageIdx('ready');
const dueToday=j=>j.due===today()&&stageIdx(j.stage)<stageIdx('ready');
function boardView(){
  const jobs=S.jobs.filter(j=>U.boardEv==='all'||j.eventId===U.boardEv);
  const open=jobs.filter(j=>j.stage!=='done'),late=jobs.filter(isLate).length;

  return `<div class="view-head"><div><h2>Production board</h2>
    <p>Every submission becomes a job in New order. Drag it to the next stage, or use its move button, and the customer gets the update you set up for that stage.</p></div></div>
  <div class="stats"><div class="stat"><b>${open.length}</b><span>Open jobs</span></div><div class="stat"><b>${dt}</b><span>Due today</span></div>
    <div class="stat ${late?'alert':''}"><b>${late}</b><span>Overdue</span></div><div class="stat"><b>${sentToday}</b><span>Updates sent today</span></div></div>
  <div class="boardtools"><label for="bf-ev">Showing</label><select id="bf-ev"><option value="all">All events</option>${S.events.map(e=>`<option value="${e.id}" ${U.boardEv===e.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select></div>
  <div class="board-scroll"><div class="board">${STAGES.map((s,i)=>{
    const list=jobs.filter(j=>j.stage===s.id).sort((a,b)=>a.due.localeCompare(b.due)||a.created-b.created);const r=S.rules[s.id];
    return `<section class="col" data-stage="${s.id}" aria-label="${s.name}">
      <div class="col-head"><span class="dot" style="--c:var(--s-${s.id})"></span>${s.name}<span class="count">${list.length}</span></div>
      <div class="col-rule ${r.on?'on':''}">${r.on?'● Customer is notified':'○ No customer message'}</div>
      ${list.length?list.map(j=>ticket(j,i)).join(''):'<div class="empty-col">Drop a job here</div>'}</section>`}).join('')}</div></div>`;
}
function ticket(j,i){
  const next=STAGES[i+1],ev=getEv(j.eventId);
  const st=isLate(j)?'<span class="pill bad">Overdue</span>':dueToday(j)?'<span class="pill warn">Due today</span>':j.stage==='done'?'<span class="pill good">Done</span>':'';
  return `<article class="ticket" draggable="true" data-num="${j.num}">
    <button class="t-open" data-open="${j.num}" aria-label="Open order QTG-${j.num}"></button>
    <div class="t-top"><span class="t-num mono">QTG-${j.num}</span>${st}<span class="chan">${CHANNELS[j.customer.channel]}</span></div>
    <div class="t-body"><div class="t-cust">${esc(j.customer.name)}</div><div class="t-item">${esc(j.summary)}</div>
      ${ev?`<span class="evtag" style="--c:${ev.theme.accent}"><i></i><span>${esc(ev.title)}</span></span>`:''}
      <div class="t-meta">${j.assignee?`<span class="avatar" title="${esc(j.assignee)}">${j.assignee.slice(0,2).toUpperCase()}</span>`:'<span class="avatar none" title="Unassigned">?</span>'}<span>Due ${fmtDay(j.due)}</span></div></div>
    ${next?`<button class="btn t-next" data-move="${j.num}" data-to="${next.id}">Move to ${next.name} →</button>`:''}</article>`;
}
function bindBoard(){
  const m=$('main');
  $('bf-ev').onchange=e=>{U.boardEv=e.target.value;saveUI();render()};
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{U.openJob=+b.dataset.open;U.openSub=null;renderDrawer()});
  m.querySelectorAll('[data-move]').forEach(b=>b.onclick=e=>{e.stopPropagation();moveJob(b.dataset.move,b.dataset.to)});
  m.querySelectorAll('.ticket').forEach(t=>{t.ondragstart=e=>{e.dataTransfer.setData('text/plain',t.dataset.num);t.classList.add('dragging')};t.ondragend=()=>t.classList.remove('dragging')});
  m.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=e=>{if(!c.contains(e.relatedTarget))c.classList.remove('over')};
    c.ondrop=e=>{e.preventDefault();c.classList.remove('over');moveJob(e.dataTransfer.getData('text/plain'),c.dataset.stage)}});
}

/* ---------- Notifications ---------- */
function messagesView(){
  const msgs=[...S.messages].sort((a,b)=>b.t-a.t);
  return `<div class="view-head"><div><h2>Notifications</h2><p>Choose which stages send the customer an update, and what it says. Each event form sets whether updates go by SMS, WhatsApp or email.</p></div></div>
  <div class="grid2"><section class="panel"><h3 style="font-size:18px;margin-bottom:4px">When a job reaches…</h3>
    <p class="vars" style="margin:0 0 14px">Insert details with <code>{name}</code> <code>{order}</code> <code>{event}</code> <code>{link}</code> <code>{business}</code></p>
    <div class="rules">${STAGES.map(s=>{const r=S.rules[s.id];return `<div class="rule ${r.on?'':'off'}">
      <div class="rule-head"><span class="dot" style="--c:var(--s-${s.id})"></span>${s.name}<label class="switch">${r.on?'On':'Off'}<input type="checkbox" data-rule="${s.id}" ${r.on?'checked':''} aria-label="Send update at ${s.name}"></label></div>
      <textarea data-text="${s.id}" id="rt-${s.id}" aria-label="Message for ${s.name}">${esc(r.text)}</textarea></div>`}).join('')}</div></section>
  <section class="panel"><h3 style="font-size:18px;margin-bottom:4px">Message log</h3><p class="vars" style="margin:0 0 6px">${msgs.length} messages · newest first</p>
    <div class="log">${msgs.length?msgs.map(m=>`<div class="msg"><span class="icon">${m.channel==='email'?'@':m.channel==='whatsapp'?'WA':'SMS'}</span>
      <div class="to">${esc(m.contact)} <span class="muted mono" style="font-weight:400">${esc(m.to)}</span><button class="linkbtn mono" data-open="${m.num}" style="font-size:12px">QTG-${m.num}</button></div>
      <div class="body">${esc(m.body)}</div><div class="when">${fmtTime(m.t)} · ${stageName(m.stage)} · ${m.example?'Sample':'Simulated send'}</div></div>`).join(''):'<p class="muted">No messages yet.</p>'}</div></section></div>`;
}
function bindMessages(){
  document.querySelectorAll('[data-rule]').forEach(c=>c.onchange=()=>{S.rules[c.dataset.rule].on=c.checked;save();render();toast(`${stageName(c.dataset.rule)} updates turned ${c.checked?'on':'off'}.`)});
  document.querySelectorAll('[data-text]').forEach(t=>t.oninput=()=>{S.rules[t.dataset.text].text=t.value;save()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{U.openJob=+b.dataset.open;U.openSub=null;renderDrawer()});
}

/* ---------- Tracking ---------- */
function trackView(){
  const j=U.trackNum?findJob(U.trackNum):null;
  let body;
  if(!j)body=`<div class="panel"><p class="muted" style="margin:0 0 10px">Pick an order to see its tracking page:</p><div style="display:flex;gap:8px;flex-wrap:wrap">${S.jobs.slice().sort((a,b)=>b.num-a.num).map(x=>`<button class="btn small mono" data-t="${x.num}">QTG-${x.num}</button>`).join('')}</div></div>`;
  else{
    const ev=getEv(j.eventId),reached={},ci=stageIdx(j.stage),art=artSrc(ev);
    j.events.filter(e=>e.type==='stage').forEach(e=>reached[e.stage]=e.t);
    const now_=j.stage==='done'?'Your order is complete. Thank you!':j.stage==='ready'?`Ready to collect from the ${BUSINESS} stand. Bring your order number.`:'Expected by '+fmtDay(j.due);
    body=`<div class="fill-frame"><div class="qf-wrap qf-banner${art?'':' noart'}" style="${themeStyle(ev.theme)}"><div class="qf">
      ${art?`<div class="qf-art"><img src="${art}" alt=""></div>`:''}
      <div class="qf-main"><div class="qf-card"><div class="qf-eyebrow">${esc(ev.title)} · ${BUSINESS}</div>
        <h2 class="qf-title" style="font-size:clamp(24px,5cqi,32px)">Order <span style="font-family:var(--f-mono);font-weight:500">QTG-${j.num}</span></h2>
        <p class="qf-intro">${esc(j.summary)}</p>
        <div class="tnow"><div style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.75">Current status</div><b>${stageName(j.stage)}</b><span style="font-size:14px">${now_}</span></div>
        <ol class="tsteps">${STAGES.map((s,i)=>{const cls=i<ci||(i===ci&&j.stage==='done')?'done':i===ci?'current':'todo';
          return `<li class="${cls}"><span class="mark">${cls==='done'?'✓':''}</span><span class="nm">${s.name}</span><span class="dt">${reached[s.id]&&i<=ci?fmtTime(reached[s.id]):''}</span></li>`}).join('')}</ol>
        <p class="qf-help" style="margin:0">Questions? Contact ${BUSINESS} and quote QTG-${j.num}.</p></div>
        <div class="qf-powered">Powered by QueuedToGo</div></div></div></div></div>
      <p style="text-align:center;margin-top:12px"><button class="linkbtn" id="t-staff">Open this job as staff</button> · <button class="linkbtn" id="t-other">Track a different order</button></p>`;
  }
  return `<div class="view-head"><div><h2>Tracking page</h2><p>What customers see when they open their tracking link. It uses the event's design, and internal notes and staff names stay hidden.</p></div></div>
  <div class="track"><form class="track-find" id="tfind"><input type="text" id="t-num" placeholder="Order number, e.g. QTG-1042" value="${j?'QTG-'+j.num:''}" aria-label="Order number"><button class="btn primary">Track</button></form>${body}</div>`;
}
function bindTrack(){
  $('tfind').onsubmit=e=>{e.preventDefault();const n=$('t-num').value.replace(/\D/g,'');if(findJob(n)){U.trackNum=+n;render()}else toast('No order with that number. Check the number on the confirmation message.')};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{U.trackNum=+b.dataset.t;render()});
  if($('t-staff'))$('t-staff').onclick=()=>{U.openJob=U.trackNum;U.openSub=null;renderDrawer()};
  if($('t-other'))$('t-other').onclick=()=>{U.trackNum=null;render()};
}

/* ---------- Drawer: one order (submission + job) ---------- */
function renderDrawer(){
  const root=$('drawer-root');
  let j=U.openJob?findJob(U.openJob):null, s=U.openSub?findSub(U.openSub):null;
  if(j&&!s)s=findSub(j.subId); if(s&&!j&&s.num)j=findJob(s.num);
  if(!j&&!s){root.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  const ev=getEv((s||j).eventId),art=artSrc(ev);
  const msgs=j?S.messages.filter(m=>m.num===j.num).sort((a,b)=>b.t-a.t):[];
  const ansRows=s?ev.fields.filter(isInput).map(f=>{const v=s.answers[f.id];
    const val=f.type==='upload'&&v?(v.data?`<img class="art" src="${v.data}" alt="${esc(v.name)}">`:esc(v.name)):esc(ansText(f,v));
    return `<dt>${esc(f.label)}</dt><dd>${val||'<span class="muted">—</span>'}</dd>`}).join(''):'';
  root.innerHTML=`<div class="scrim" id="scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Order details">
    <div class="d-head"><div><div class="mono muted" style="font-size:13px">${j?'QTG-'+j.num:'Submission'}${(j||s).example?' · sample':''}</div>
      <h3>${esc(j?j.customer.name:'Submission')}</h3><div class="muted" style="font-size:14px">${j?esc(j.summary):''}</div>
      <span class="evtag" style="--c:${ev.theme.accent};margin-top:6px"><i></i><span>${esc(ev.title)}</span></span></div>
      <button class="btn small x" id="d-close">Close</button></div>
    ${j?`<div class="d-sec"><div class="row">
      <label class="f">Stage<select id="d-stage">${STAGES.map(x=>`<option value="${x.id}" ${x.id===j.stage?'selected':''}>${x.name}</option>`).join('')}</select></label>
      <label class="f">Assigned to<select id="d-assignee"><option value="">Unassigned</option>${TEAM.map(t=>`<option ${t===j.assignee?'selected':''}>${t}</option>`).join('')}</select></label></div>
      <label class="f" style="margin-top:12px">Due date<input type="date" id="d-due" value="${j.due}"></label>
      ${isLate(j)?`<p style="margin:10px 0 0"><span class="pill bad">Overdue since ${fmtDay(j.due)}</span></p>`:''}</div>`:'<div class="d-sec"><p class="muted" style="margin:0">This form does not create production jobs, so this submission has no job.</p></div>'}
    ${s?`<div class="d-sec"><h4>Form answers · ${fmtTime(s.t)}</h4><dl class="kv">${ansRows}</dl></div>`:''}
    ${j?`<div class="d-sec"><h4>Customer updates</h4><dl class="kv">
      <dt>Sent by</dt><dd>${CHANNELS[j.customer.channel]} ${j.customer.consent?'<span class="pill good">Agreed</span>':'<span class="pill warn">Not agreed</span>'}</dd>
      <dt>Tracking link</dt><dd><span class="mono" style="font-size:13px">${trackLink(j)}</span> <button class="linkbtn" id="d-track" style="font-size:13px">Preview</button></dd></dl></div>
    <div class="d-sec"><h4>Activity</h4>
      <div class="inline-add" style="margin-bottom:12px"><input type="text" id="d-note" placeholder="Add an internal note (customer won't see it)" aria-label="Internal note"><button class="btn small" id="d-addnote">Add</button></div>
      <ul class="events">${j.events.slice().reverse().map(e=>`<li class="${e.type==='note'?'note-ev':''}"><span><span class="who">${esc(e.who)}</span> ${e.type==='note'?'noted: <span class="nt">'+esc(e.text)+'</span>':esc(e.text)}</span><time>${fmtTime(e.t)}</time></li>`).join('')}</ul></div>
    <div class="d-sec"><h4>Messages to customer (${msgs.length})</h4>${msgs.length?`<div class="log">${msgs.map(m=>`<div class="msg"><span class="icon">${m.channel==='email'?'@':m.channel==='whatsapp'?'WA':'SMS'}</span><div class="body">${esc(m.body)}</div><div class="when">${fmtTime(m.t)} · ${stageName(m.stage)}</div></div>`).join('')}</div>`:'<p class="muted" style="margin:0;font-size:14px">None yet.</p>'}</div>`:''}
  </aside></div>`;
  const close=()=>{U.openJob=null;U.openSub=null;renderDrawer()};
  $('d-close').onclick=close;$('scrim').onclick=e=>{if(e.target.id==='scrim')close()};$('d-close').focus();
  if(!j)return;
  $('d-stage').onchange=e=>moveJob(j.num,e.target.value);
  $('d-assignee').onchange=e=>{j.assignee=e.target.value;j.events.push({t:now(),who:'You',text:e.target.value?'Assigned to '+e.target.value:'Removed assignee',type:'assign'});save();render();toast(e.target.value?`Assigned to ${e.target.value}.`:'Job is unassigned.')};
  $('d-due').onchange=e=>{if(!e.target.value)return;j.due=e.target.value;j.events.push({t:now(),who:'You',text:'Changed due date to '+fmtDay(j.due),type:'due'});save();render();toast('Due date updated.')};
  const addNote=()=>{const v=$('d-note').value.trim();if(!v)return;j.events.push({t:now(),who:'You',text:v,type:'note'});save();render();toast('Note added. Only your team can see it.')};
  $('d-addnote').onclick=addNote;$('d-note').onkeydown=e=>{if(e.key==='Enter')addNote()};
  $('d-track').onclick=()=>{U.openJob=null;U.openSub=null;go('track',{trackNum:j.num})};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(U.openJob||U.openSub)){U.openJob=null;U.openSub=null;renderDrawer()}});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.view,{fillDone:null}));
$('reset').onclick=()=>{const old=S;S=seed();Object.assign(U,{openJob:null,openSub:null,trackNum:null,fillDone:null,sel:null});save();render();
  toast('Sample data restored.',{label:'Undo',fn:()=>{S=old;save();render()}})};
render();
</script>
