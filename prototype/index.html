<title>QueuedToGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;800&display=swap">
<style>
/* Layout: workshop app shell. Sticky top bar with section tabs; each section is one working surface.
   Event forms carry their own design (theme + per-element styles) generated from saved, validated config. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#E8EAF1; --fg:#161A2B; --muted:#5A6077; --line:#D4D8E3;
  --accent:#3346D3; --accent-fg:#FFFFFF; --accent-soft:#E2E6FF;
  --good:#1D8657; --good-soft:#DDF3E8; --warn:#9A6512; --warn-soft:#FBEFD6; --bad:#BF3438; --bad-soft:#FBE1E1;
  --s-new:#7B8194; --s-artwork:#9A5BD0; --s-production:#3346D3; --s-qc:#C9821B; --s-ready:#1D8657; --s-done:#5A6077;
  --check-a:#CDD1DB; --check-b:#FFFFFF;
  --shadow:0 1px 2px rgba(22,26,43,.06),0 2px 8px rgba(22,26,43,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131B; --surface:#1A1D28; --surface-2:#252937; --fg:#E7E9F2; --muted:#9BA1B8; --line:#313649;
  --accent:#8D9BFF; --accent-fg:#0F1230; --accent-soft:#262C56;
  --good:#52C68F; --good-soft:#173527; --warn:#E3B04D; --warn-soft:#3A2E14; --bad:#F27377; --bad-soft:#3E1C1F;
  --s-new:#9BA1B8; --s-artwork:#C493F0; --s-production:#8D9BFF; --s-qc:#E3B04D; --s-ready:#52C68F; --s-done:#7D839A;
  --check-a:#3A3F52; --check-b:#252937;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131B; --surface:#1A1D28; --surface-2:#252937; --fg:#E7E9F2; --muted:#9BA1B8; --line:#313649;
  --accent:#8D9BFF; --accent-fg:#0F1230; --accent-soft:#262C56;
  --good:#52C68F; --good-soft:#173527; --warn:#E3B04D; --warn-soft:#3A2E14; --bad:#F27377; --bad-soft:#3E1C1F;
  --s-new:#9BA1B8; --s-artwork:#C493F0; --s-production:#8D9BFF; --s-qc:#E3B04D; --s-ready:#52C68F; --s-done:#7D839A;
  --check-a:#3A3F52; --check-b:#252937;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:21px}
.brand h1 span{color:var(--accent)}
.ws{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.note{font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px;border-top:1px dashed var(--line)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}

main{padding-block:20px 48px}
.view-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:26px}
.view-head p{margin:2px 0 0;color:var(--muted);max-width:66ch}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.alert b{color:var(--bad)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.stagepill{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.evtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.evtag i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.evtag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=url],input[type=search],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
label.f small,.hint{font-weight:400;color:var(--muted);font-size:12.5px}
.hint{margin:0}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.row{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.4;cursor:default}
.seg.sm{gap:4px}
.seg.sm button{padding:5px 9px;font-size:12.5px;border-radius:7px}
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(14px)}

/* ---------- Forms list ---------- */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.evcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.evthumb{aspect-ratio:12/5;background:var(--c);position:relative;overflow:hidden;max-width:100%}
.evthumb img{width:100%;height:100%;object-fit:cover;display:block}
.evthumb .pill{position:absolute;top:10px;left:10px}
.evthumb .noart{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;opacity:.8}
.evbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.evbody h3{font-size:18px}
.evnums{font-size:13px;color:var(--muted);margin-top:4px}
.evacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.newcard{border:1.5px dashed var(--line);border-radius:12px;background:none;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;min-height:220px;color:var(--muted)}
.newcard:hover{border-color:var(--accent);color:var(--accent)}
.newcard b{display:block;font:600 18px var(--f-display);color:var(--fg);margin-bottom:4px}

/* ---------- Builder ---------- */
.b-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.b-top h2{font-size:22px;min-width:0;overflow-wrap:anywhere}
.b-top .sp{flex:1}
.savestate{font-size:12.5px;color:var(--muted)}
.savestate.bad{color:var(--bad);font-weight:600}
.builder{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.builder{grid-template-columns:minmax(0,1fr)}}
.bpanel{padding:0;overflow:hidden}
.btabs{display:flex;border-bottom:1px solid var(--line)}
.btabs button{flex:1;border:0;background:none;padding:12px 8px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.btabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.bbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.bsec{display:flex;flex-direction:column;gap:10px}
.bsec h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.blks{display:flex;flex-direction:column}
.blk{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.blk.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.blk.is-submit{background:var(--surface-2)}
.blk.is-page{border-style:dashed}
.blk.dragging{opacity:.45}
.blk.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.blk.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.blk-row{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 0}
.grip{color:var(--muted);cursor:grab;padding:0 0 0 8px;font-size:13px;letter-spacing:-3px;user-select:none}
.blk-th{width:30px;height:30px;border-radius:5px;object-fit:cover;flex:none;background:var(--surface-2)}
.blk-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column}
.blk-type{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.blk-label{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk-label .req{color:var(--bad)}
.blk-acts{display:flex}
.blk-acts button{border:0;background:none;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px}
.blk-acts button:hover{background:var(--surface-2);color:var(--fg)}
.blk-acts button:disabled{opacity:.3;cursor:default;background:none}
.blk-ed{border-top:1px dashed var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.ins-row{display:block;width:100%;height:8px;border:0;background:none;padding:0;cursor:pointer;color:transparent;font-size:0;border-radius:8px;transition:height .12s}
.ins-row:hover,.ins-row:focus-visible{height:28px;font-size:12px;color:var(--accent);border:1.5px dashed var(--accent);font-weight:600;margin-block:2px}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.addgrid button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font-size:13px;display:flex;gap:8px;align-items:center}
.addgrid button:hover{border-color:var(--accent);color:var(--accent)}
.addgrid b{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:22px;text-align:center}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;max-width:100%}
.linkbox span{overflow-wrap:anywhere;font-size:13px;flex:1;min-width:0}

/* design panel */
.dsec{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dsec>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;border-radius:10px}
.dsec>summary::-webkit-details-marker,.sub>summary::-webkit-details-marker{display:none}
.dsec>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:none}
.dsec[open]>summary::after{transform:rotate(-135deg)}
.dsec>summary:hover{background:var(--bg)}
.dsec>summary .tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:99px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsec-b{padding:4px 14px 16px;display:flex;flex-direction:column;gap:14px}
.dsec-b:empty{display:none}
.sub{border-top:1px dashed var(--line);padding-top:8px}
.sub>summary{list-style:none;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 0}
.sub>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.sub[open]>summary::before{transform:rotate(45deg)}
.sub-b{display:flex;flex-direction:column;gap:12px;padding:8px 0 4px}
.c{display:flex;flex-direction:column;gap:4px;min-width:0}
.cl{font-size:12px;color:var(--muted);font-weight:500}
.cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ci{display:flex;align-items:center;position:relative;min-width:0}
.ci i{position:absolute;right:8px;font-style:normal;font-size:11px;color:var(--muted);pointer-events:none}
.ci input{padding-right:26px!important}
.ci2{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:4px}
.bbody input[type=number],.bbody input[type=text],.bbody input[type=url],.bbody select{padding:7px 9px;font-size:13.5px;border-radius:7px}
.cg4 input[type=number]{padding:7px 4px 7px 7px}
.elhead{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:9px;background:var(--surface-2)}
.elhead b{font-size:14.5px;overflow-wrap:anywhere}
.elhead code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.notebox{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.contrast{font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.contrast:empty{display:none}
.contrast .ok{color:var(--good)} .contrast .low{color:var(--bad);font-weight:600} .contrast .info{color:var(--muted)}
.fontpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.fontpick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.fontpick button b{font-size:20px;line-height:1.2}
.fontpick button span{font-size:12px;color:var(--muted)}
.fontpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.artbox{display:flex;gap:12px;align-items:center;border:1.5px dashed transparent;border-radius:10px;padding:4px}
.artbox.over,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.artbox .th{width:120px;aspect-ratio:12/5;border-radius:8px;overflow:hidden;background:var(--surface-2);flex:none;display:grid;place-items:center;font-size:12px;color:var(--muted);max-width:100%}
.artbox .th img{width:100%;height:100%;object-fit:cover;display:block}
/* colour control */
.cc{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,7.6rem) 28px 28px;align-items:center;gap:6px}
.cc-sw,.dot-c{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;transition:transform .1s;
  background:linear-gradient(var(--sw),var(--sw)),repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/10px 10px;box-shadow:inset 0 0 0 2px var(--surface)}
.cc-sw:hover,.dot-c:hover{transform:scale(1.08)}
.cc-tx{font-family:var(--f-mono);font-size:12.5px!important;padding:6px 8px!important}
.cc.bad .cc-tx{border-color:var(--bad)}
.cc-err{grid-column:1/-1;font-size:12px;color:var(--bad)}
.cc-err:empty{display:none}
.cc-ic{width:28px;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.cc-ic:hover{background:var(--surface-2);color:var(--fg)}
.cc-ic svg{width:15px;height:15px}
.dotrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dotwrap{position:relative;display:inline-flex}
.dotwrap .x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:10px;line-height:16px;padding:0;cursor:pointer;opacity:0}
.dotwrap:hover .x,.dotwrap .x:focus-visible{opacity:1}
.dot-add{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--muted);background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0}
.dot-add:hover{border-color:var(--accent);color:var(--accent)}
.texgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.texbtn{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font-size:11px;color:var(--muted);padding:2px 0}
.texbtn span{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:block}
.texbtn[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.texbtn[aria-pressed="true"]{color:var(--accent);font-weight:600}
.corner-lbl{font-size:11px;color:var(--muted);text-align:center}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:8px;align-items:center}
.artlist{display:flex;flex-direction:column;gap:6px}
.artrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px}
.artrow.on{border-color:var(--accent)}
.artrow img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.artrow .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artrow .ps{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artrow .ac{display:flex;flex-wrap:wrap;justify-content:flex-end}

function parseColor(str){
  if(str==null)return null;const s=String(str).trim().toLowerCase();
  let m=s.match(/^#([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/);
  if(m){let h=m[1];if(h.length<=4)h=h.split('').map(c=>c+c).join('');
    const v=[0,2,4,6].map(i=>parseInt(h.slice(i,i+2)||'ff',16));return {r:v[0],g:v[1],b:v[2],a:+(v[3]/255).toFixed(3)}}
  m=s.match(/^rgba?\(\s*([\d.]+%?)\s*[,\s]\s*([\d.]+%?)\s*[,\s]\s*([\d.]+%?)\s*(?:[,/]\s*([\d.]+%?)\s*)?\)$/);
  if(m){const ch=x=>x.endsWith('%')?parseFloat(x)*2.55:parseFloat(x);const r=ch(m[1]),g=ch(m[2]),b=ch(m[3]);
    const a=m[4]==null?1:(m[4].endsWith('%')?parseFloat(m[4])/100:parseFloat(m[4]));
    if([r,g,b].some(v=>!(v>=0&&v<=255))||!(a>=0&&a<=1))return null;
    return {r:Math.round(r),g:Math.round(g),b:Math.round(b),a:+a.toFixed(3)}}
  return null;
}
const h2=v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0').toUpperCase();
const toHex=c=>'#'+h2(c.r)+h2(c.g)+h2(c.b)+(c.a<.999?h2(c.a*255):'');
const toRgba=c=>c.a<.999?`rgba(${Math.round(c.r)}, ${Math.round(c.g)}, ${Math.round(c.b)}, ${+c.a.toFixed(2)})`:`rgb(${Math.round(c.r)}, ${Math.round(c.g)}, ${Math.round(c.b)})`;
const cc=v=>{if(v==null||v==='')return null;const c=parseColor(v);return c?toHex(c):null};
const alphaMul=(v,m)=>{const c=parseColor(v);return c?toHex({...c,a:Math.max(0,Math.min(1,c.a*m))}):null};
const rgbOf=v=>parseColor(v)||{r:0,g:0,b:0,a:1};
function over(fg,bg){const f=rgbOf(fg),b=rgbOf(bg),a=f.a;return toHex({r:f.r*a+b.r*(1-a),g:f.g*a+b.g*(1-a),b:f.b*a+b.b*(1-a),a:1})}
function mix(a,b,t){const A=rgbOf(a),B=rgbOf(b);return toHex({r:A.r+(B.r-A.r)*t,g:A.g+(B.g-A.g)*t,b:A.b+(B.b-A.b)*t,a:1})}
function lum(h){const c=rgbOf(h);return [c.r,c.g,c.b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function sat(h){const c=rgbOf(h),r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx===mn)return 0;const l=(mx+mn)/2;return (mx-mn)/(1-Math.abs(2*l-1))}
const bestOn=bg=>contrast(bg,'#FFFFFF')>=contrast(bg,'#141414')?'#FFFFFF':'#141414';
const shade=(c,t)=>lum(c)>.2?mix(c,'#000000',t):mix(c,'#FFFFFF',t);
function rgb2hsv({r,g,b}){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return {h,s:mx?d/mx:0,v:mx}}
function hsv2rgb({h,s,v}){const f=k0=>{const k=(k0+h/60)%6;return (v-v*s*Math.max(0,Math.min(k,4-k,1)))*255};return {r:f(5),g:f(3),b:f(1)}}

function paletteFromCanvas(ctx,w,h){
  const d=ctx.getImageData(0,0,w,h).data,buckets={};
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const k=[d[i],d[i+1],d[i+2]].map(v=>v>>4).join(',');
    (buckets[k]=buckets[k]||{n:0,r:0,g:0,b:0}).n++;buckets[k].r+=d[i];buckets[k].g+=d[i+1];buckets[k].b+=d[i+2]}
  const list=Object.values(buckets).sort((a,b)=>b.n-a.n).map(b=>toHex({r:b.r/b.n,g:b.g/b.n,b:b.b/b.n,a:1}));
  const out=[];for(const c of list){if(out.every(o=>{const A=rgbOf(o),B=rgbOf(c);return Math.hypot(A.r-B.r,A.g-B.g,A.b-B.b)>60}))out.push(c);if(out.length>=6)break}
  return out;
}
function themeFromPalette(p,base){
  const page=p[0],darkPage=lum(page)<.05;
  const card=darkPage?mix(page,'#FFFFFF',.08):mix(page,'#FFFFFF',.92);
  const text=darkPage?mix(page,'#FFFFFF',.93):mix(page,'#000000',.82);
  let accent=[...p].sort((a,b)=>(sat(b)-Math.abs(lum(b)-.35))-(sat(a)-Math.abs(lum(a)-.35)))[0]||page;
  for(let i=0;i<12&&contrast(accent,card)<1.8;i++)accent=mix(accent,darkPage?'#FFFFFF':'#000000',.12);
  return {...base,page,card,text,accent,accentText:bestOn(accent)};
}

/* ================= Assets (uploaded files) =================
   Uploaded images live in IndexedDB (the prototype's file store); forms keep only {asset:id} references. */
const Assets={mem:{},db:null,warned:false,
  init(){return new Promise(res=>{try{const r=indexedDB.open('qtg-assets',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('a');
    r.onsuccess=()=>{this.db=r.result;try{const q=this.db.transaction('a','readonly').objectStore('a').openCursor();
      q.onsuccess=()=>{const c=q.result;if(c){if(typeof c.value==='string'&&SAFE_DATA.test(c.value))this.mem[c.key]=c.value;c.continue()}else res()};q.onerror=()=>res()}catch(e){res()}};
    r.onerror=()=>res()}catch(e){res()}})},
  put(url){const id='as_'+uid()+uid();this.mem[id]=url;
    if(this.db){try{this.db.transaction('a','readwrite').objectStore('a').put(url,id)}catch(e){this.warn()}}else this.warn();return id},
  get(id){return this.mem[id]||null},
  warn(){if(!this.warned){this.warned=true;setTimeout(()=>toast('This browser is blocking file storage, so uploaded images will disappear when you reload.'),1500)}}};
function srcOf(ref){
  if(!ref)return null;
  if(ref.asset){const u=Assets.get(ref.asset);return u&&SAFE_DATA.test(u)?u:null}
  if(ref.data)return SAFE_DATA.test(ref.data)?ref.data:null;
  if(ref.gen)return genArt(ref.gen);
  return null;
}
const artSrc=ev=>srcOf(ev.art);
function b64(str){const bytes=new TextEncoder().encode(str);let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s)}
function sanitizeSvg(txt){
  let doc;try{doc=new DOMParser().parseFromString(txt,'image/svg+xml')}catch(e){return null}
  const root=doc.documentElement;
  if(!root||root.localName!=='svg'||doc.getElementsByTagName('parsererror').length)return null;
  const BAD=new Set(['script','foreignobject','iframe','object','embed','audio','video','canvas','handler','listener']);
  [...root.querySelectorAll('*')].forEach(el=>{const nm=el.localName.toLowerCase();
    if(BAD.has(nm)){el.remove();return}
    if(['set','animate'].includes(nm)&&/href/i.test(el.getAttribute('attributeName')||''))el.remove()});
  [root,...root.querySelectorAll('*')].forEach(el=>{
    [...el.attributes].forEach(a=>{const nm=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
      if(nm.startsWith('on'))el.removeAttribute(a.name);
      else if((nm==='href'||nm.endsWith(':href')||nm==='src')&&!(v.startsWith('#')||/^data:image\/(png|jpe?g|webp|gif);base64,/.test(v)))el.removeAttribute(a.name);
      else if(/javascript:|url\(\s*['"]?\s*(https?:|\/\/|javascript:|data:(?!image\/(png|jpe?g|webp|gif)))/i.test(a.value))el.removeAttribute(a.name)});
    if(el.localName==='style')el.textContent=el.textContent.replace(/@import[^;]*;?/gi,'').replace(/url\(\s*['"]?\s*(?!#)[^)]*\)/gi,'none');
  });
  return new XMLSerializer().serializeToString(root);
}
const ALLOWED_IMG=['image/png','image/jpeg','image/webp','image/svg+xml'];
function readAs(file,how){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('That file could not be read.'));how==='text'?r.readAsText(file):r.readAsDataURL(file)})}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That file is not an image this browser can open. Try a PNG or JPG.'));i.src=url})}
async function processImage(file,maxW=1600){
  let type=file.type;if(!type&&/\.svg$/i.test(file.name))type='image/svg+xml';
  if(!ALLOWED_IMG.includes(type))throw new Error('Use a PNG, JPG, SVG or WebP image.');
  const lim=type==='image/svg+xml'?1e6:10e6;
  if(file.size>lim)throw new Error(`That file is ${(file.size/1e6).toFixed(1)} MB. ${type==='image/svg+xml'?'SVG files':'Images'} can be up to ${lim/1e6} MB.`);
  if(type==='image/svg+xml'){
    const clean=sanitizeSvg(await readAs(file,'text'));if(!clean)throw new Error('That SVG file could not be read. Export it again and try once more.');
    const url='data:image/svg+xml;base64,'+b64(clean);const img=await loadImg(url);
    return {url,name:file.name,w:img.naturalWidth||300,h:img.naturalHeight||150,svg:true};
  }
  const img=await loadImg(await readAs(file,'url'));
  const w=Math.min(maxW,img.naturalWidth),h=Math.max(1,Math.round(w*img.naturalHeight/img.naturalWidth));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let url=type==='image/jpeg'?c.toDataURL('image/jpeg',.86):c.toDataURL('image/webp',.9);
  if(!SAFE_DATA.test(url))url=c.toDataURL('image/png');
  return {url,name:file.name,w,h,img};
}
function pickFile(cb){const g=$('gfile');g.value='';g.onchange=async()=>{const f=g.files[0];if(!f)return;try{cb(await processImage(f))}catch(e){toast(e.message)}};g.click()}
async function handleDropFile(file,cb){try{cb(await processImage(file))}catch(e){toast(e.message)}}

/* ---------- generated sample artwork ---------- */
const artCache={};
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function genArt(kind){
  if(artCache[kind])return artCache[kind];
  const W=1200,H=kind==='stitch'?420:500,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  if(kind==='food'){
    const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#0F4C4A');gr.addColorStop(1,'#14615C');g.fillStyle=gr;g.fillRect(0,0,W,H);
    [[980,120,210,'#F2994A'],[1120,380,150,'#F7C948'],[180,420,180,'#E8633A'],[640,-40,120,'#F7C948']].forEach(([x,y,r,col])=>{g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()});
    g.strokeStyle='#FFF4E2';g.lineWidth=10;g.globalAlpha=.85;
    for(let k=0;k<4;k++){g.beginPath();for(let x=0;x<=W;x+=10){const y=150+k*70+Math.sin(x/70+k)*18;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
    g.globalAlpha=1;g.fillStyle='#FFF4E2';for(let i=0;i<60;i++){g.beginPath();g.arc((i*197)%W,(i*131)%H,4,0,7);g.fill()}
  }else if(kind==='sports'){
    g.fillStyle='#12306B';g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=6;
    for(let k=0;k<6;k++){g.beginPath();g.ellipse(W*.35,H*1.15,300+k*70,190+k*55,0,Math.PI,2*Math.PI);g.stroke()}
    g.fillStyle='#FFC93C';g.beginPath();g.moveTo(760,0);g.lineTo(920,0);g.lineTo(700,H);g.lineTo(540,H);g.fill();
    g.fillStyle='#E4572E';g.beginPath();g.moveTo(960,0);g.lineTo(1010,0);g.lineTo(790,H);g.lineTo(740,H);g.fill();
    g.fillStyle='#FFFFFF';for(let i=0;i<5;i++){const x=980+i*45,y=80+i*70;g.save();g.translate(x,y);g.rotate(.3);g.fillRect(-14,-14,28,28);g.restore()}
  }else if(kind==='stitch'){
    g.fillStyle='#FFF4E2';g.fillRect(0,0,W,H);g.strokeStyle='rgba(15,76,74,.08)';g.lineWidth=1;
    for(let x=0;x<W;x+=6){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=6){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
    const P=[['Block','bold 84px Arial, sans-serif','fill','#0F4C4A','Block letters'],['Script','italic bold 80px Georgia, serif','fill','#E8633A','Script'],['Outline','bold 80px Arial, sans-serif','stroke','#0F4C4A','Outline']];
    P.forEach(([t,font,mode,col,cap],i)=>{const x=40+i*380,y=50,w=340,h=320;
      g.fillStyle='#FFFFFF';rrect(g,x,y,w,h,24);g.fill();g.setLineDash([16,10]);g.lineWidth=4;g.strokeStyle='#E8633A';rrect(g,x+12,y+12,w-24,h-24,16);g.stroke();g.setLineDash([]);
      g.font=font;g.textAlign='center';g.textBaseline='middle';
      if(mode==='fill'){g.fillStyle=col;g.fillText(t,x+w/2,y+h/2-16)}else{g.lineWidth=3;g.strokeStyle=col;g.strokeText(t,x+w/2,y+h/2-16)}
      g.font='600 24px Arial, sans-serif';g.fillStyle='#1B2B2A';g.fillText(cap,x+w/2,y+h-52)});
  }else{
    g.fillStyle='#170B2E';g.fillRect(0,0,W,H);g.strokeStyle='rgba(155,92,255,.35)';g.lineWidth=2;
    for(let i=0;i<=20;i++){g.beginPath();g.moveTo(W/2,H*.55);g.lineTo(i*W/20,H);g.stroke()}
    for(let i=0;i<6;i++){g.beginPath();g.moveTo(0,H*.55+i*i*7);g.lineTo(W,H*.55+i*i*7);g.stroke()}
    g.shadowBlur=30;g.lineWidth=12;
    [['#FF4FA3',240],['#3DE3F5',190],['#FFB13D',140]].forEach(([col,r])=>{g.shadowColor=col;g.strokeStyle=col;g.beginPath();g.arc(W/2,H*.55,r,Math.PI,2*Math.PI);g.stroke()});
    g.shadowBlur=0;
  }
  return artCache[kind]=c.toDataURL('image/jpeg',.88);
}
function ensurePalette(ev,cb){
  if(ev.palette&&ev.palette.length)return cb&&cb();
  const src=artSrc(ev);if(!src)return;
  loadImg(src).then(img=>{const c=document.createElement('canvas');c.width=80;c.height=Math.max(1,Math.round(80*img.height/img.width));
    const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);ev.palette=paletteFromCanvas(g,c.width,c.height);save();cb&&cb()}).catch(()=>{});
}

function merge(...os){const out={};for(const o of os){if(!o||typeof o!=='object')continue;
  for(const k of Object.keys(o)){if(k==='__proto__'||k==='constructor'||k==='prototype')continue;const v=o[k];if(v===undefined||v===null)continue;
    if(typeof v==='object'&&!Array.isArray(v))out[k]=merge(obj(out[k]),v);else out[k]=v}}return out}

function elementsOf(ev){
  const L=[{sid:'__title',kind:'heading',name:'Form title',title:true},{sid:'__intro',kind:'text',name:'Intro text',intro:true}];
  let pages=0;
  for(const f of ev.fields){
    const nm=(f.label||BLOCKS[f.type].name).slice(0,34);
    switch(f.type){
      case 'submit':L.push({sid:'__submit',kind:'button',btn:'submit',name:'Submit button'});break;

const getEv=id=>S.events.find(e=>e.id===id);
const findJob=num=>S.jobs.find(j=>j.num===+num);
const findSub=id=>S.subs.find(s=>s.id===id);
const trackLink=j=>'queuedtogo.app/t/'+j.token;
const formLink=ev=>'queuedtogo.app/f/'+ev.slug;
function sumQty(v){return v&&typeof v==='object'&&!Array.isArray(v)?Object.values(v).reduce((a,b)=>a+(+b||0),0):0}
function ansText(f,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
  if(f.type==='sizes')return Object.entries(v).filter(([,k])=>+k>0).map(([s,k])=>`${s} ${k}`).join(', ');
  if(Array.isArray(v))return v.join(', ');
  if(f.type==='upload')return v.name||'';
  if(f.type==='date')return fmtDay(v);
  return String(v);
}
function createSubmission(S,ev,answers,consent,o={}){
  const t=o.t||now();
  const fv=type=>{const f=ev.fields.find(f=>f.type===type);return f?answers[f.id]:''};
  const nameF=ev.fields.find(f=>f.role==='name')||ev.fields.find(f=>f.type==='short');
  const itemF=ev.fields.find(f=>f.role==='item'),sizesF=ev.fields.find(f=>f.type==='sizes'),dueF=ev.fields.find(f=>f.role==='due');
  const name=(nameF&&answers[nameF.id])||'Customer',qty=sizesF?sumQty(answers[sizesF.id]):0,item=itemF?ansText(itemF,answers[itemF.id]):'';
  const sub={id:uid(),eventId:ev.id,t,answers,consent:!!consent,num:null,example:!!o.example};
  S.subs.push(sub);
  if(ev.autoJob){
    const j={num:S.nextNum++,token:uid(),eventId:ev.id,subId:sub.id,example:!!o.example,
      customer:{name,phone:fv('phone')||'',email:fv('email')||'',channel:ev.notify.channel,consent:!!consent},
      summary:(qty?qty+' × ':'')+(item||'Order'),due:(dueF&&answers[dueF.id])||ev.date,stage:'new',assignee:'',created:t,
      events:[{t,who:name,text:'Submitted the '+ev.title+' form',type:'stage',stage:'new'}]};
    S.jobs.push(j);sub.num=j.num;
    if(o.silent){if(S.rules.new.on&&consent)S.messages.push(makeMsg(S,j,'new',t,o.example))}
    else sub.notice=notify(j,'new');
  }
  return sub;
}
function makeMsg(S,j,stage,t,example){
  const c=j.customer,ev=S.events.find(e=>e.id===j.eventId);
  const body=S.rules[stage].text.replaceAll('{name}',c.name.split(' ')[0]).replaceAll('{order}','QTG-'+j.num)
    .replaceAll('{business}',BUSINESS).replaceAll('{link}',trackLink(j)).replaceAll('{event}',ev?ev.title:'');
  return {id:uid(),num:j.num,to:c.channel==='email'?c.email:c.phone,contact:c.name,channel:c.channel,body,t,stage,example:!!example};
}
function notify(j,stage){
  const r=S.rules[stage],c=j.customer;
  if(!r.on)return 'No customer message for this stage.';
  if(!c.consent)return `${c.name} did not agree to updates, so no message was sent.`;
  if(c.channel==='email'?!c.email:!c.phone)return `No ${c.channel==='email'?'email address':'phone number'} on this order, so no message was sent.`;
  S.messages.push(makeMsg(S,j,stage,now()));
  return `${CHANNELS[c.channel]} update sent to ${c.name}.`;
}
function moveJob(num,stage){
  const j=findJob(num);if(!j||j.stage===stage)return;
  const from=j.stage;j.stage=stage;
  j.events.push({t:now(),who:'You',text:`Moved from ${stageName(from)} to ${stageName(stage)}`,type:'stage',stage});
  const sent=notify(j,stage);save();render();
  toast(`QTG-${j.num} moved to ${stageName(stage)}. ${sent}`);
}

function toast(msg,action){

}

/* ================= Undo / redo (per form, in the builder) ================= */
const H={id:null,cur:null,undo:[],redo:[],t:0,co:false};
function histInit(ev){if(H.id!==ev.id){H.id=ev.id;H.undo=[];H.redo=[];H.cur=JSON.stringify(ev);H.co=false}}
function histCommit(ev,coalesce){
  const s=JSON.stringify(ev);if(s===H.cur)return;const t=now();
  if(!(coalesce&&H.co&&t-H.t<900)){H.undo.push(H.cur);if(H.undo.length>100)H.undo.shift()}
  H.co=!!coalesce;H.t=t;H.cur=s;H.redo=[];
}
function histApply(dir){
  const from=dir<0?H.undo:H.redo,to=dir<0?H.redo:H.undo;if(!from.length||H.id!==U.builderId)return;
  to.push(H.cur);H.cur=from.pop();H.co=false;
  const i=S.events.findIndex(e=>e.id===H.id);S.events[i]=normalizeEvent(JSON.parse(H.cur));
  save();closePicker(true);render();toast(dir<0?'Undone.':'Redone.');
}
function updHist(){const u=$('b-undo'),r=$('b-redo');if(u)u.disabled=!H.undo.length;if(r)r.disabled=!H.redo.length}

function pagesOf(ev){
  const pages=[{blocks:[],pb:null}];let sub=null;
  ev.fields.forEach((f,i)=>{if(f.type==='submit'){sub={f,i};return}if(f.type==='page'){pages[pages.length-1].pb={f,i};pages.push({blocks:[],pb:null})}else pages[pages.length-1].blocks.push({f,i})});
  const last=pages[pages.length-1];
  if(sub){const onLast=pages.length===1||pages[pages.length-2].pb.i<sub.i;
    if(onLast){const at=last.blocks.findIndex(b=>b.i>sub.i);at<0?last.blocks.push(sub):last.blocks.splice(at,0,sub)}else last.blocks.push(sub)}
  return pages;
}
function fieldHtml(f,mode){
  const E=mode==='edit',ti=E?' tabindex="-1"':'';
  const req=f.required?'<span class="qf-req" aria-hidden="true">*</span>':'';
  const help=f.help?`<div class="qf-help" id="qh-${f.id}">${esc(f.help)}</div>`:'';
  const ph=f.placeholder?` placeholder="${esc(f.placeholder)}"`:'';
  const desc=` aria-describedby="${f.help?'qh-'+f.id+' ':''}qe-${f.id}"`;
  const lab=`<label class="qf-label" data-sid="${f.id}__label" data-kind="label" for="q-${f.id}">${esc(f.label)}${req}</label>`;
  const glab=`<span class="qf-label" data-sid="${f.id}__label" data-kind="label" id="ql-${f.id}">${esc(f.label)}${req}</span>`;
  const err=`<div class="qf-ferr" id="qe-${f.id}" aria-live="polite"></div>`;
  const wrap=(kind,inner)=>`<div class="qf-field" data-sid="${f.id}" data-kind="${kind}">${inner}${err}</div>`;
  const lock=f.locked&&LOCKABLE.has(f.type),lv=lock?` value="${esc(f.value||'')}" disabled`:'';
  switch(f.type){
    case 'heading':return `<h3 class="qf-h" data-sid="${f.id}" data-kind="heading">${esc(f.label)}</h3>`;
    case 'text':return `<p class="qf-p" data-sid="${f.id}" data-kind="text">${esc(f.label)}</p>`;
    case 'divider':return `<hr class="qf-hr" data-sid="${f.id}" data-kind="divider">`;
    case 'button':{const u=safeUrl(f.url);return `<a class="qf-btn qf-link" data-sid="${f.id}" data-kind="button" href="${esc(u||'#')}" target="_blank" rel="noopener noreferrer"${ti}>${esc(f.label)} <span aria-hidden="true">↗</span></a>`}
    case 'image':{const g=merge(IMG_DEFAULT,f.img),src=srcOf(g.src);
      if(!src)return E?`<div class="qf-img-empty" data-sid="${f.id}" data-kind="image">This artwork has no image. Select it and choose a file.</div>`:'';
      const img=`<img src="${src}" alt="${esc(g.alt)}">`,link=safeUrl(g.link);
      return `<figure class="qf-img" data-sid="${f.id}" data-kind="image">${link?`<a class="qf-img-in" href="${esc(link)}" target="_blank" rel="noopener noreferrer"${ti}>${img}</a>`:`<span class="qf-img-in">${img}</span>`}</figure>`}
    case 'short':case 'email':case 'phone':case 'date':case 'number':
      return wrap('input',lab+help+`<input class="qf-in" id="q-${f.id}" name="${f.id}" type="${{short:'text',email:'email',phone:'tel',date:'date',number:'number'}[f.type]}"${ph}${f.type==='phone'?' inputmode="tel" autocomplete="tel"':''}${f.type==='email'?' autocomplete="email"':''}${f.required?' aria-required="true"':''}${desc}${lv}${ti}>`);
    case 'long':return wrap('input',lab+help+`<textarea class="qf-in" id="q-${f.id}" name="${f.id}"${ph}${desc}${ti}></textarea>`);
    case 'dropdown':return wrap('input',lab+help+`<select class="qf-in" id="q-${f.id}" name="${f.id}"${desc}${ti}><option value="">Choose…</option>${f.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`);
    case 'choice':case 'multi':{const ty=f.type==='choice'?'radio':'checkbox',list=f.display==='list';
      return wrap('choice',glab+help+`<div class="qf-opts${list?' list':''}" role="${f.type==='choice'?'radiogroup':'group'}" aria-labelledby="ql-${f.id}"${desc}>${f.options.map(o=>list
        ?`<label class="qf-li"><input type="${ty}" name="${f.id}" value="${esc(o)}"${ti}><span>${esc(o)}</span></label>`
        :`<label class="qf-opt"><input type="${ty}" name="${f.id}" value="${esc(o)}"${ti}><span>${esc(o)}</span></label>`).join('')}</div>`)}
    case 'sizes':return wrap('input',glab+help+`<div class="qf-sizes" role="group" aria-labelledby="ql-${f.id}">${f.options.map(o=>`<label>${esc(o)}<input class="qf-in" type="number" min="0" inputmode="numeric" name="${f.id}" data-size="${esc(o)}" placeholder="0"${ti}></label>`).join('')}</div>`);
    case 'upload':return wrap('input',glab+help+`<label class="qf-upload" for="q-${f.id}" id="qp-${f.id}"><span><b>Choose a file</b> or drop it here</span></label><input type="file" id="q-${f.id}" data-up="${f.id}" accept="image/*,.pdf" hidden>`);
  }
  return '';
}
function formBody(ev,mode){
  const E=mode==='edit',ti=E?' tabindex="-1"':'',pages=pagesOf(ev),multi=pages.length>1;
  const ins=(i,after)=>E?`<button type="button" class="qf-ins${after?' after':''}" data-ins="${i}">+ Artwork</button>`:'';
  const prevBtn=i=>`<button type="button" class="qf-btn qf-prev" data-sid="__prev" data-kind="button" data-nav="prev"${ti}>${esc(pages[i-1].pb.f.prev||'Back')}</button>`;
  const prog=multi&&ev.design.adv.progress?`<div class="qf-prog" id="qf-prog"><div class="qf-prog-track"><span style="width:${(100/pages.length).toFixed(1)}%"></span></div><div class="qf-step">${E?`${pages.length} pages`:`Step <b>1</b> of ${pages.length}`}</div></div>`:'';
  let html='';
  pages.forEach((pg,i)=>{
    let inner='';
    pg.blocks.forEach(({f,i:idx},k)=>{
      const lastBlk=k===pg.blocks.length-1&&!pg.pb;
      if(f.type==='submit'){
        inner+=`<div class="qf-blk" data-idx="${idx}">${ins(idx)}${ev.notify.consent?`<label class="qf-check"><input type="checkbox" id="qf-consent" checked${ti}> Send me ${CHANNELS[ev.notify.channel]} updates about my order. Reply STOP to opt out.</label>`:''}<div class="qf-nav">${i>0?prevBtn(i):''}<button type="submit" class="qf-btn qf-submit" data-sid="__submit" data-kind="button"${ti}>${esc(ev.submitLabel||'Submit')}</button></div>${lastBlk?ins(idx+1,true):''}</div>`;
      }else{const h=fieldHtml(f,mode);if(h)inner+=`<div class="qf-blk" data-idx="${idx}">${ins(idx)}${h}${lastBlk?ins(idx+1,true):''}</div>`}
    });
    if(pg.pb)inner+=`<div class="qf-blk" data-idx="${pg.pb.i}">${ins(pg.pb.i)}<div class="qf-nav">${i>0?prevBtn(i):''}<button type="button" class="qf-btn qf-next" data-sid="__next" data-kind="button" data-nav="next"${ti}>${esc(pg.pb.f.next||'Next')}</button></div></div>`;
    html+=`<section class="qf-page" data-page="${i}"${!E&&i>0?' hidden':''}>${inner}</section>`;
    if(E&&pg.pb)html+=`<div class="qf-pbmark" data-pb="${pg.pb.f.id}">Page ${i+2}</div>`;
  });
  return `<form class="qf-form" id="qf-form" novalidate>${prog}${html}</form>`;
}
function formHtml(ev,mode,doneSub){
  const t=ev.theme,art=artSrc(ev),L=t.layout,E=mode==='edit';
  const head=`<div class="qf-eyebrow">${fmtDay(ev.date)}${ev.venue?' · '+esc(ev.venue):''}</div><h2 class="qf-title" data-sid="__title" data-kind="heading">${esc(ev.title)}</h2>${ev.intro?`<p class="qf-intro" data-sid="__intro" data-kind="text">${esc(ev.intro)}</p>`:''}`;
  let content;
  if(doneSub){const j=doneSub.num?findJob(doneSub.num):null;
    content=`<div class="qf-done"><h2 class="qf-title" data-sid="__title" data-kind="heading">You're in the queue!</h2><p class="qf-intro" data-sid="__intro" data-kind="text">${esc(ev.thanks)}</p>
      ${j?`<div>Your order number</div><div class="num">QTG-${j.num}</div><div class="lk">${trackLink(j)}</div>`:''}
      <button class="qf-btn" type="button" id="qf-again" data-sid="__submit" data-kind="button">Submit another order</button></div>`}
  else if(mode==='live'&&ev.status!=='live')content=head+`<div class="qf-closed">${ev.status==='closed'?'This form is closed and no longer taking orders.':'This form is a draft. Customers cannot open it until you set it to Live in the form settings.'}</div>`;
  else content=head+formBody(ev,mode);
  return `<style id="qfs-${ev.id}">${designCss(ev)}</style><div class="qf-wrap qf-${L}${art?'':' noart'}${E?' editing':''}" data-qf="${ev.id}" style="${themeStyle(t)}"><div class="qf">
    ${art&&L!=='background'?`<div class="qf-art"><img src="${art}" alt="${esc(ev.title)} artwork"></div>`:''}
    ${art&&L==='background'?`<div class="qf-bg"><img src="${art}" alt=""></div>`:''}
    <div class="qf-main"><div class="qf-card">${content}</div><div class="qf-powered">Order form by ${BUSINESS} · Powered by QueuedToGo</div></div>
  </div></div>`;
}

const PANELS={content:contentPanel,design:designPanel,settings:settingsPanel};

/* ---------- Questions tab ---------- */
function rowLabel(ev,f){
  if(f.type==='submit')return esc(ev.submitLabel||'Submit');
  if(f.type==='page')return 'Page break · '+esc(f.next||'Next');
  if(f.type==='image')return esc(f.img.alt||f.img.name||'Artwork');
  if(f.type==='divider')return '—';
  return (esc(f.label)||'<span class="muted">Untitled</span>')+(f.required?' <span class="req">*</span>':'');
}
function contentPanel(ev){
  const openF=fidOf(U.pick);
  const rows=ev.fields.map((f,i)=>{
    const open=openF===f.id,isSub=f.type==='submit',th=f.type==='image'?srcOf(f.img.src):null;
    const role=f.role?' · '+{name:'customer name',item:'job item',due:'due date'}[f.role]:'';
    return `<button type="button" class="ins-row" data-insart="${i}">+ Insert artwork here</button>
    <div class="blk${open?' open':''}${f.type==='page'?' is-page':''}${isSub?' is-submit':''}" data-bid="${f.id}" data-i="${i}">
      <div class="blk-row" draggable="true"><span class="grip" title="Drag to reorder" aria-hidden="true">⋮⋮</span>${f.type==='image'?(th?`<img class="blk-th" src="${th}" alt="">`:'<span class="blk-th"></span>'):''}
        <button class="blk-main" data-selq="${f.id}" aria-expanded="${open}"><span class="blk-type">${BLOCKS[f.type].name}${role}</span><span class="blk-label" id="bl-${f.id}">${rowLabel(ev,f)}</span></button>
        <div class="blk-acts"><button data-mv="-1" title="Move up" aria-label="Move up" ${i===0?'disabled':''}>↑</button><button data-mv="1" title="Move down" aria-label="Move down" ${i===ev.fields.length-1?'disabled':''}>↓</button>
        ${isSub?'':`<button data-dup title="Duplicate" aria-label="Duplicate">⧉</button><button data-del title="Delete" aria-label="Delete">✕</button>`}</div></div>
      ${open?editorHtml(ev,f):''}</div>`}).join('');
  return `<div class="bsec"><h4>Questions and blocks</h4><p class="hint">Drag blocks to reorder them. Drop an image file onto the list to add artwork at that spot.</p>
      <div class="blks" id="blks">${rows}<button type="button" class="ins-row" data-insart="${ev.fields.length}">+ Insert artwork here</button></div></div>
    <div class="bsec"><h4>Add a block</h4><div class="addgrid">${Object.entries(BLOCKS).filter(([,b])=>!b.internal).map(([k,b])=>`<button data-add="${k}"><b>${b.k}</b>${b.name}</button>`).join('')}</div>
      <p class="hint">New blocks go after the open block, or above the Submit button.</p></div>`;
}
function editorHtml(ev,f){
  const B=BLOCKS[f.type];let h='';
  const style=(sid,what)=>`<button class="btn small" data-action="gostyle" data-sid="${sid}" style="align-self:flex-start">Style ${what} in Design →</button>`;
  if(f.type==='submit')return `<div class="blk-ed"><label class="f">Button text<input type="text" id="ed-sub" data-p="ev.submitLabel" data-t="str" value="${esc(ev.submitLabel)}"></label>
    <p class="hint">On forms with page breaks, Submit always appears on the last page. Blocks placed below it show under the button.</p>${style('__submit','this button')}</div>`;
  if(f.type==='page')return `<div class="blk-ed"><div class="row"><label class="f">Next button text<input type="text" id="ed-next" data-k="next" value="${esc(f.next)}"></label>
    <label class="f">Back button text<input type="text" id="ed-prev" data-k="prev" value="${esc(f.prev)}"></label></div>
    <p class="hint">Customers must answer this page's required questions before Next takes them on.</p>${style('__next','the Next buttons')}</div>`;
  if(f.type==='image')return `<div class="blk-ed">${imageContent(f)}${style(f.id,'this artwork')}</div>`;
  if(f.type!=='divider')h+=f.type==='text'?`<label class="f">Text<textarea id="ed-label" data-k="label">${esc(f.label)}</textarea></label>`
    :`<label class="f">${f.type==='button'?'Button text':f.type==='heading'?'Heading':'Question'}<input type="text" id="ed-label" data-k="label" value="${esc(f.label)}"></label>`;
  if(f.type==='button')h+=`<label class="f">Opens this link<input type="url" id="ed-url" data-k="url" value="${esc(f.url||'')}" placeholder="https://"></label>`;
  if(isInput(f))h+=`<label class="f">Help text <small>shown under the question</small><input type="text" id="ed-help" data-k="help" value="${esc(f.help)}"></label>`;
  if(['short','long','email','phone','number'].includes(f.type))h+=`<label class="f">Placeholder<input type="text" id="ed-ph" data-k="placeholder" value="${esc(f.placeholder||'')}"></label>`;
  if(B.opts)h+=`<label class="f">${f.type==='sizes'?'Sizes':'Options'} <small>one per line</small><textarea id="ed-opts" data-k="options">${esc(f.options.join('\n'))}</textarea></label>`;
  if(f.type==='choice'||f.type==='multi')h+=`<label class="f">Show options as<select id="ed-disp" data-k="display"><option value="buttons" ${f.display!=='list'?'selected':''}>Buttons</option><option value="list" ${f.display==='list'?'selected':''}>${f.type==='choice'?'Radio list':'Checkbox list'}</option></select></label>`;
  if(isInput(f))h+=`<label class="switch"><input type="checkbox" id="ed-req" data-k="required" ${f.required?'checked':''}>Required</label>`;
  if(LOCKABLE.has(f.type)){h+=`<label class="switch"><input type="checkbox" id="ed-lock" data-k="locked" ${f.locked?'checked':''}>Prefill and lock this answer</label>`;
    if(f.locked)h+=`<label class="f">Locked answer <small>customers see it but can't change it</small><input type="text" id="ed-val" data-k="value" value="${esc(f.value||'')}"></label>`}
  const role={short:['name','Use as the customer name on jobs'],choice:['item','Show this answer as the item on job cards'],dropdown:['item','Show this answer as the item on job cards'],date:['due','Use this date as the job due date']}[f.type];
  if(role)h+=`<label class="switch"><input type="checkbox" id="ed-role" data-role="${role[0]}" ${f.role===role[0]?'checked':''}>${role[1]}</label>`;
  return `<div class="blk-ed">${h}${style(f.id,'this '+(isInput(f)?'field':'block'))}</div>`;
}
function imageContent(f){
  const g=f.img,src=srcOf(g.src);
  return `<div class="imgc">${src?`<img src="${src}" alt="">`:'<span class="blk-th" style="width:64px;height:64px"></span>'}
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0"><button class="btn small" data-action="repimg" data-fid="${f.id}">${src?'Replace image':'Choose image'}</button>
      <span class="hint" style="overflow-wrap:anywhere">${esc(g.name||'')}</span></div></div>
    ${cText('Alternative text',`img.${f.id}.alt`,g.alt,{hint:'Describe the image for people using screen readers. Leave it empty if the image is only decoration.'})}
    ${cText('Link when clicked',`img.${f.id}.link`,g.link,{type:'url',ph:'https://',hint:'Optional. Opens in a new tab.'})}`;
}

/* ---------- Controls (reusable) ---------- */
const pid=p=>'c_'+p.replace(/[^A-Za-z0-9]/g,'_');
const canReset=p=>/^(e|g)\./.test(p);
function cNum(label,path,val,o={}){return `<label class="c" for="${pid(path)}"><span class="cl">${label}</span><span class="ci"><input type="number" id="${pid(path)}" data-p="${path}" data-t="num" value="${val??''}"${o.min!=null?` min="${o.min}"`:''}${o.max!=null?` max="${o.max}"`:''} step="${o.step||1}">${o.unit?`<i>${o.unit}</i>`:''}</span></label>`}
function cSel(label,path,val,opts,o={}){return `<label class="c" for="${pid(path)}"><span class="cl">${label}</span><select id="${pid(path)}" data-p="${path}" data-t="${o.t||'str'}"${o.rr?' data-rr':''}>${opts.map(([v,l])=>`<option value="${v}" ${String(v)===String(val)?'selected':''}>${l}</option>`).join('')}</select></label>`}
function cSeg(label,path,val,opts,o={}){return `<div class="c"><span class="cl">${label}</span><div class="seg sm" role="group" aria-label="${label}">${opts.map(([v,l])=>`<button type="button" data-p="${path}" data-v="${v}" data-t="${o.t||'str'}" aria-pressed="${String(val)===String(v)}">${l}</button>`).join('')}</div></div>`}
function cTog(label,path,val,o={}){return `<label class="switch"><input type="checkbox" id="${pid(path)}" data-p="${path}" data-t="bool"${o.rr?' data-rr':''}${val?' checked':''}>${label}</label>`}
function cText(label,path,val,o={}){return `<label class="c" for="${pid(path)}"><span class="cl">${label}</span><input type="${o.type||'text'}" id="${pid(path)}" data-p="${path}" data-t="${o.type==='url'?'url':'str'}" value="${esc(val||'')}"${o.ph?` placeholder="${o.ph}"`:''}>${o.hint?`<span class="hint">${o.hint}</span>`:''}<span class="cc-err" data-err="${path}"></span></label>`}
function cColor(label,path,val,o={}){
  const v=cc(val)||'',clear=!!o.clear&&canReset(path);
  return `<div class="cc" data-cc="${path}"><span class="cl">${label}</span>
    <button type="button" class="cc-sw" data-cpopen="${path}" style="--sw:${v||'transparent'}" aria-label="${label}: ${v||'none'}. Open colour picker"${clear?' data-clear':''}></button>
    <input type="text" class="cc-tx" id="${pid(path)}" data-p="${path}" data-t="color" value="${v}" placeholder="${clear?'None':'#000000'}" spellcheck="false" autocomplete="off" aria-label="${label} colour code"${clear?' data-clear':''}>
    <button type="button" class="cc-ic" data-copy="${path}" title="Copy colour code" aria-label="Copy ${label} colour code">${ICON_COPY}</button>
    ${canReset(path)?`<button type="button" class="cc-ic" data-reset="${path}" title="Reset to default" aria-label="Reset ${label}">${ICON_RESET}</button>`:'<span></span>'}
    <span class="cc-err"></span></div>`;
}
function cBox(label,path,p){p=obj(p);return `<div class="c"><span class="cl">${label} <span class="hint">top · right · bottom · left (px)</span></span><div class="cg4">${['t','r','b','l'].map(k=>`<input type="number" id="${pid(path+'.'+k)}" data-p="${path}.${k}" data-t="num" min="0" max="80" value="${p[k]??0}" aria-label="${label} ${{t:'top',r:'right',b:'bottom',l:'left'}[k]}">`).join('')}</div></div>`}
function cRadius(path,r){r=obj(r);const linked=r.linked!==false;
  return `<div class="c"><span class="cl">Corner shape</span><div class="seg sm">${SHAPES.map(([k,l])=>`<button type="button" data-action="radpreset" data-path="${path}" data-v="${RADII[k]}" aria-pressed="${linked&&+r.all===RADII[k]}">${l}</button>`).join('')}</div></div>
    ${cTog('Same radius on every corner',path+'.linked',linked,{rr:true})}
    ${linked?cNum('Corner radius',path+'.all',r.all,{min:0,max:999,unit:'px'})
      :`<div class="cg4">${[['tl','Top left'],['tr','Top right'],['br','Bottom right'],['bl','Bottom left']].map(([k,l])=>`<label class="c"><input type="number" id="${pid(path+'.'+k)}" data-p="${path}.${k}" data-t="num" min="0" max="999" value="${r[k]??0}" aria-label="${l} radius"><span class="corner-lbl">${l}</span></label>`).join('')}</div>`}`}
function cTex(path,t,base){
  return `<div class="c"><span class="cl">Texture</span><div class="texgrid">${TEXTURES.map(([k,l])=>{const u=texUrl(k,t.texColor||'#000000',Math.max(40,+t.texOp||0),10);
    return `<button type="button" class="texbtn" data-p="${path}.tex" data-v="${k}" aria-pressed="${(t.tex||'none')===k}"><span style="background-color:${cc(base)||'#FFFFFF'};${u?`background-image:${u};background-size:10px 10px`:''}"></span>${l}</button>`}).join('')}</div></div>
    ${t.tex&&t.tex!=='none'?`${cColor('Texture colour',path+'.texColor',t.texColor)}<div class="cg">${cNum('Texture strength',path+'.texOp',t.texOp,{min:0,max:100,unit:'%'})}${cNum('Pattern size',path+'.texScale',t.texScale,{min:4,max:80,unit:'px'})}</div>`:''}`;

function sub(key,title,html){return `<details class="sub" data-sec="sub-${key}"${U.open['sub-'+key]!==false?' open':''}><summary>${title}</summary><div class="sub-b">${html}</div></details>`}

function grpBox(pf,s,el){

function grpBg(pf,bg){
  bg=obj(bg);const P=pf+'.bg',t=bg.type||'solid';
  let h=cSeg('Fill',P+'.type',t,[['solid','Solid'],['gradient','Gradient'],['texture','Texture'],['image','Image']]);
  h+=cColor(t==='gradient'?'Start colour':t==='image'?'Base colour':'Background colour',P+'.color',bg.color);
  if(t==='gradient')h+=cColor('End colour',P+'.color2',bg.color2)+`<div class="cg">${cNum('Angle',P+'.angle',bg.angle,{min:0,max:360,unit:'°'})}${cSel('Style',P+'.gtype',bg.gtype,[['linear','Linear'],['radial','Radial']])}</div>`;
  if(t==='texture')h+=cTex(P,bg,bg.color);

  const show=i=>{pages.forEach((p,k)=>p.hidden=k!==i);curP=i;const pr=$('qf-prog');

    form.closest('.qf-card').scrollIntoView({block:'start',behavior:'smooth'});refreshDisabled();
    const first=pages[i].querySelector('.qf-in:not(:disabled),.qf-opt input,.qf-li input');first&&first.focus({preventScroll:true})};
  form.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=()=>{const file=inp.files[0];if(!file)return;const id=inp.dataset.up,box=$('qp-'+id),f=ev.fields.find(x=>x.id===id);

      box.innerHTML=`<img src="${uploads[id].data}" alt=""><span><b>${esc(file.name)}</b><br><small>Tap to replace</small></span>`;validateField(f,true);refreshDisabled()}).catch(e=>toast(e.message))});

    else rows=[['Order','Submitted','Event','Customer','Order details','Stage'],...list.map(s=>{const j=s.num&&findJob(s.num),ev=getEv(s.eventId);return['QTG-'+s.num,new Date(s.t).toISOString(),ev.title,j?j.customer.name:'',j?j.summary:'',j?stageName(j.stage):'']})];
    copyText(rows.map(r=>r.map(q).join(',')).join('\n'),`Copied ${list.length} rows. Paste them into a spreadsheet.`);
  };
}

/* ---------- Production board ---------- */
const isLate=j=>j.due<today()&&stageIdx(j.stage)<stageIdx('ready');
const dueToday=j=>j.due===today()&&stageIdx(j.stage)<stageIdx('ready');
function boardView(){
  const jobs=S.jobs.filter(j=>U.boardEv==='all'||j.eventId===U.boardEv),open=jobs.filter(j=>j.stage!=='done'),late=jobs.filter(isLate).length;
  const dt=jobs.filter(dueToday).length,sentToday=S.messages.filter(m=>isoDay(m.t)===today()).length;
  return `<div class="view-head"><div><h2>Production board</h2>
    <p>Every submission becomes a job in New order. Drag it to the next stage, or use its move button, and the customer gets the update you set up for that stage.</p></div></div>
  <div class="stats"><div class="stat"><b>${open.length}</b><span>Open jobs</span></div><div class="stat"><b>${dt}</b><span>Due today</span></div>
    <div class="stat ${late?'alert':''}"><b>${late}</b><span>Overdue</span></div><div class="stat"><b>${sentToday}</b><span>Updates sent today</span></div></div>
  <div class="boardtools"><label for="bf-ev">Showing</label><select id="bf-ev"><option value="all">All events</option>${S.events.map(e=>`<option value="${e.id}" ${U.boardEv===e.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select></div>
  <div class="board-scroll"><div class="board">${STAGES.map((s,i)=>{
    const list=jobs.filter(j=>j.stage===s.id).sort((a,b)=>a.due.localeCompare(b.due)||a.created-b.created),r=S.rules[s.id];
    return `<section class="col" data-stage="${s.id}" aria-label="${s.name}">
      <div class="col-head"><span class="dot" style="--c:var(--s-${s.id})"></span>${s.name}<span class="count">${list.length}</span></div>
      <div class="col-rule ${r.on?'on':''}">${r.on?'● Customer is notified':'○ No customer message'}</div>
      ${list.length?list.map(j=>ticket(j,i)).join(''):'<div class="empty-col">Drop a job here</div>'}</section>`}).join('')}</div></div>`;
}
function ticket(j,i){
  const next=STAGES[i+1],ev=getEv(j.eventId);
  const st=isLate(j)?'<span class="pill bad">Overdue</span>':dueToday(j)?'<span class="pill warn">Due today</span>':j.stage==='done'?'<span class="pill good">Done</span>':'';
  return `<article class="ticket" draggable="true" data-num="${j.num}">
    <button class="t-open" data-open="${j.num}" aria-label="Open order QTG-${j.num}"></button>
    <div class="t-top"><span class="t-num mono">QTG-${j.num}</span>${st}<span class="chan">${CHANNELS[j.customer.channel]}</span></div>
    <div class="t-body"><div class="t-cust">${esc(j.customer.name)}</div><div class="t-item">${esc(j.summary)}</div>
      ${ev?`<span class="evtag" style="--c:${cc(ev.theme.accent)}"><i></i><span>${esc(ev.title)}</span></span>`:''}
      <div class="t-meta">${j.assignee?`<span class="avatar" title="${esc(j.assignee)}">${esc(j.assignee.slice(0,2).toUpperCase())}</span>`:'<span class="avatar none" title="Unassigned">?</span>'}<span>Due ${fmtDay(j.due)}</span></div></div>
    ${next?`<button class="btn t-next" data-move="${j.num}" data-to="${next.id}">Move to ${next.name} →</button>`:''}</article>`;
}
function bindBoard(){
  const m=$('main');
  $('bf-ev').onchange=e=>{U.boardEv=e.target.value;saveUI();render()};
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{U.openJob=+b.dataset.open;U.openSub=null;renderDrawer()});
  m.querySelectorAll('[data-move]').forEach(b=>b.onclick=e=>{e.stopPropagation();moveJob(b.dataset.move,b.dataset.to)});
  m.querySelectorAll('.ticket').forEach(t=>{t.ondragstart=e=>{e.dataTransfer.setData('text/plain',t.dataset.num);t.classList.add('dragging')};t.ondragend=()=>t.classList.remove('dragging')});
  m.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=e=>{if(!c.contains(e.relatedTarget))c.classList.remove('over')};
    c.ondrop=e=>{e.preventDefault();c.classList.remove('over');moveJob(e.dataTransfer.getData('text/plain'),c.dataset.stage)}});
}

/* ---------- Notifications ---------- */
function messagesView(){
  const msgs=[...S.messages].sort((a,b)=>b.t-a.t);
  return `<div class="view-head"><div><h2>Notifications</h2><p>Choose which stages send the customer an update, and what it says. Each event form sets whether updates go by SMS, WhatsApp or email.</p></div></div>
  <div class="grid2"><section class="panel"><h3 style="font-size:18px;margin-bottom:4px">When a job reaches…</h3>
    <p class="vars" style="margin:0 0 14px">Insert details with <code>{name}</code> <code>{order}</code> <code>{event}</code> <code>{link}</code> <code>{business}</code></p>
    <div class="rules">${STAGES.map(s=>{const r=S.rules[s.id];return `<div class="rule ${r.on?'':'off'}">
      <div class="rule-head"><span class="dot" style="--c:var(--s-${s.id})"></span>${s.name}<label class="switch">${r.on?'On':'Off'}<input type="checkbox" data-rule="${s.id}" ${r.on?'checked':''} aria-label="Send update at ${s.name}"></label></div>
      <textarea data-text="${s.id}" id="rt-${s.id}" aria-label="Message for ${s.name}">${esc(r.text)}</textarea></div>`}).join('')}</div></section>
  <section class="panel"><h3 style="font-size:18px;margin-bottom:4px">Message log</h3><p class="vars" style="margin:0 0 6px">${msgs.length} messages · newest first</p>
    <div class="log">${msgs.length?msgs.map(m=>`<div class="msg"><span class="icon">${m.channel==='email'?'@':m.channel==='whatsapp'?'WA':'SMS'}</span>
      <div class="to">${esc(m.contact)} <span class="muted mono" style="font-weight:400">${esc(m.to)}</span><button class="linkbtn mono" data-open="${m.num}" style="font-size:12px">QTG-${m.num}</button></div>
      <div class="body">${esc(m.body)}</div><div class="when">${fmtTime(m.t)} · ${stageName(m.stage)} · ${m.example?'Sample':'Simulated send'}</div></div>`).join(''):'<p class="muted">No messages yet.</p>'}</div></section></div>`;
}
function bindMessages(){
  document.querySelectorAll('[data-rule]').forEach(c=>c.onchange=()=>{S.rules[c.dataset.rule].on=c.checked;save();render();toast(`${stageName(c.dataset.rule)} updates turned ${c.checked?'on':'off'}.`)});
  document.querySelectorAll('[data-text]').forEach(t=>t.oninput=()=>{S.rules[t.dataset.text].text=t.value;save()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{U.openJob=+b.dataset.open;U.openSub=null;renderDrawer()});
}

/* ---------- Tracking ---------- */
function trackView(){
  const j=U.trackNum?findJob(U.trackNum):null;let body;
  if(!j)body=`<div class="panel"><p class="muted" style="margin:0 0 10px">Pick an order to see its tracking page:</p><div style="display:flex;gap:8px;flex-wrap:wrap">${S.jobs.slice().sort((a,b)=>b.num-a.num).map(x=>`<button class="btn small mono" data-t="${x.num}">QTG-${x.num}</button>`).join('')}</div></div>`;
  else{
    const ev=getEv(j.eventId),reached={},ci=stageIdx(j.stage),art=artSrc(ev);
    j.events.filter(e=>e.type==='stage').forEach(e=>reached[e.stage]=e.t);
    const now_=j.stage==='done'?'Your order is complete. Thank you!':j.stage==='ready'?`Ready to collect from the ${BUSINESS} stand. Bring your order number.`:'Expected by '+fmtDay(j.due);
    body=`<div class="fill-frame"><style>${designCss(ev)}</style><div class="qf-wrap qf-banner${art?'':' noart'}" data-qf="${ev.id}" style="${themeStyle(ev.theme)}"><div class="qf">
      ${art?`<div class="qf-art"><img src="${art}" alt=""></div>`:''}
      <div class="qf-main"><div class="qf-card"><div class="qf-eyebrow">${esc(ev.title)} · ${BUSINESS}</div>
        <h2 class="qf-title" style="font-size:clamp(24px,5cqi,32px)">Order <span style="font-family:var(--f-mono);font-weight:500">QTG-${j.num}</span></h2>
        <p class="qf-intro">${esc(j.summary)}</p>
        <div class="tnow"><div style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.75">Current status</div><b>${stageName(j.stage)}</b><span style="font-size:14px">${now_}</span></div>
        <ol class="tsteps">${STAGES.map((s,i)=>{const cls=i<ci||(i===ci&&j.stage==='done')?'done':i===ci?'current':'todo';
          return `<li class="${cls}"><span class="mark">${cls==='done'?'✓':''}</span><span class="nm">${s.name}</span><span class="dt">${reached[s.id]&&i<=ci?fmtTime(reached[s.id]):''}</span></li>`}).join('')}</ol>
        <p class="qf-help" style="margin:0">Questions? Contact ${BUSINESS} and quote QTG-${j.num}.</p></div>
        <div class="qf-powered">Powered by QueuedToGo</div></div></div></div></div>
      <p style="text-align:center;margin-top:12px"><button class="linkbtn" id="t-staff">Open this job as staff</button> · <button class="linkbtn" id="t-other">Track a different order</button></p>`;
  }
  return `<div class="view-head"><div><h2>Tracking page</h2><p>What customers see when they open their tracking link. It uses the event's design, and internal notes and staff names stay hidden.</p></div></div>
  <div class="track"><form class="track-find" id="tfind"><input type="text" id="t-num" placeholder="Order number, e.g. QTG-1042" value="${j?'QTG-'+j.num:''}" aria-label="Order number"><button class="btn primary">Track</button></form>${body}</div>`;
}
function bindTrack(){
  $('tfind').onsubmit=e=>{e.preventDefault();const n_=$('t-num').value.replace(/\D/g,'');if(findJob(n_)){U.trackNum=+n_;render()}else toast('No order with that number. Check the number on the confirmation message.')};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{U.trackNum=+b.dataset.t;render()});
  if($('t-staff'))$('t-staff').onclick=()=>{U.openJob=U.trackNum;U.openSub=null;renderDrawer()};
  if($('t-other'))$('t-other').onclick=()=>{U.trackNum=null;render()};
}

/* ---------- Drawer: one order (submission + job) ---------- */
function renderDrawer(){
  const root=$('drawer-root');
  let j=U.openJob?findJob(U.openJob):null,s=U.openSub?findSub(U.openSub):null;
  if(j&&!s)s=findSub(j.subId);if(s&&!j&&s.num)j=findJob(s.num);
  if(!j&&!s){root.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  const ev=getEv((s||j).eventId),msgs=j?S.messages.filter(m=>m.num===j.num).sort((a,b)=>b.t-a.t):[];
  const ansRows=s?ev.fields.filter(isInput).map(f=>{const v=s.answers[f.id];
    const val=f.type==='upload'&&v?(v.data&&SAFE_DATA.test(v.data)?`<img class="art" src="${v.data}" alt="${esc(v.name)}">`:esc(v.name)):esc(ansText(f,v));
    return `<dt>${esc(f.label)}</dt><dd>${val||'<span class="muted">—</span>'}</dd>`}).join(''):'';
  root.innerHTML=`<div class="scrim" id="scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Order details">
    <div class="d-head"><div><div class="mono muted" style="font-size:13px">${j?'QTG-'+j.num:'Submission'}${(j||s).example?' · sample':''}</div>
      <h3>${esc(j?j.customer.name:'Submission')}</h3><div class="muted" style="font-size:14px">${j?esc(j.summary):''}</div>
      <span class="evtag" style="--c:${cc(ev.theme.accent)};margin-top:6px"><i></i><span>${esc(ev.title)}</span></span></div>
      <button class="btn small x" id="d-close">Close</button></div>
    ${j?`<div class="d-sec"><div class="row">
      <label class="f">Stage<select id="d-stage">${STAGES.map(x=>`<option value="${x.id}" ${x.id===j.stage?'selected':''}>${x.name}</option>`).join('')}</select></label>
      <label class="f">Assigned to<select id="d-assignee"><option value="">Unassigned</option>${TEAM.map(t=>`<option ${t===j.assignee?'selected':''}>${t}</option>`).join('')}</select></label></div>
      <label class="f" style="margin-top:12px">Due date<input type="date" id="d-due" value="${j.due}"></label>
      ${isLate(j)?`<p style="margin:10px 0 0"><span class="pill bad">Overdue since ${fmtDay(j.due)}</span></p>`:''}</div>`:'<div class="d-sec"><p class="muted" style="margin:0">This form does not create production jobs, so this submission has no job.</p></div>'}
    ${s?`<div class="d-sec"><h4>Form answers · ${fmtTime(s.t)}</h4><dl class="kv">${ansRows}</dl></div>`:''}
    ${j?`<div class="d-sec"><h4>Customer updates</h4><dl class="kv">
      <dt>Sent by</dt><dd>${CHANNELS[j.customer.channel]} ${j.customer.consent?'<span class="pill good">Agreed</span>':'<span class="pill warn">Not agreed</span>'}</dd>
      <dt>Tracking link</dt><dd><span class="mono" style="font-size:13px">${trackLink(j)}</span> <button class="linkbtn" id="d-track" style="font-size:13px">Preview</button></dd></dl></div>
    <div class="d-sec"><h4>Activity</h4>
      <div class="inline-add" style="margin-bottom:12px"><input type="text" id="d-note" placeholder="Add an internal note (customer won't see it)" aria-label="Internal note"><button class="btn small" id="d-addnote">Add</button></div>
      <ul class="events">${j.events.slice().reverse().map(e=>`<li class="${e.type==='note'?'note-ev':''}"><span><span class="who">${esc(e.who)}</span> ${e.type==='note'?'noted: <span class="nt">'+esc(e.text)+'</span>':esc(e.text)}</span><time>${fmtTime(e.t)}</time></li>`).join('')}</ul></div>
    <div class="d-sec"><h4>Messages to customer (${msgs.length})</h4>${msgs.length?`<div class="log">${msgs.map(m=>`<div class="msg"><span class="icon">${m.channel==='email'?'@':m.channel==='whatsapp'?'WA':'SMS'}</span><div class="body">${esc(m.body)}</div><div class="when">${fmtTime(m.t)} · ${stageName(m.stage)}</div></div>`).join('')}</div>`:'<p class="muted" style="margin:0;font-size:14px">None yet.</p>'}</div>`:''}
  </aside></div>`;
  const close=()=>{U.openJob=null;U.openSub=null;renderDrawer()};
  $('d-close').onclick=close;$('scrim').onclick=e=>{if(e.target.id==='scrim')close()};$('d-close').focus();
  if(!j)return;
  $('d-stage').onchange=e=>moveJob(j.num,e.target.value);
  $('d-assignee').onchange=e=>{j.assignee=e.target.value;j.events.push({t:now(),who:'You',text:e.target.value?'Assigned to '+e.target.value:'Removed assignee',type:'assign'});save();render();toast(e.target.value?`Assigned to ${e.target.value}.`:'Job is unassigned.')};
  $('d-due').onchange=e=>{if(!e.target.value)return;j.due=e.target.value;j.events.push({t:now(),who:'You',text:'Changed due date to '+fmtDay(j.due),type:'due'});save();render();toast('Due date updated.')};
  const addNote=()=>{const v=$('d-note').value.trim();if(!v)return;j.events.push({t:now(),who:'You',text:v,type:'note'});save();render();toast('Note added. Only your team can see it.')};
  $('d-addnote').onclick=addNote;$('d-note').onkeydown=e=>{if(e.key==='Enter')addNote()};
  $('d-track').onclick=()=>{U.openJob=null;U.openSub=null;go('track',{trackNum:j.num})};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(U.openJob||U.openSub)){U.openJob=null;U.openSub=null;renderDrawer()}});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.view,{fillDone:null}));
$('reset').onclick=()=>{const old=S;S=seed();H.id=null;Object.assign(U,{openJob:null,openSub:null,trackNum:null,fillDone:null,pick:null});save();render();
  toast('Sample data restored.',{label:'Undo',fn:()=>{S=old;H.id=null;save();render()}})};
window.addEventListener('scroll',()=>{if(CP.open&&innerWidth>520)closePicker(true)},{passive:true});
render();
Assets.init().then(()=>{
  let moved=false;S.events.forEach(ev=>{if(ev.art&&ev.art.data&&SAFE_DATA.test(ev.art.data)){ev.art={asset:Assets.put(ev.art.data),name:ev.art.name||''};moved=true}});
  if(moved)save();if(U.view!=='fill')render();
});
</script>
